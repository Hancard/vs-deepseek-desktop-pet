      var my = Math.max(0, Math.min(menuAnchorY, window.innerHeight - mh - 4));
      contextMenu.style.left = mx + 'px';
      contextMenu.style.top = my + 'px';
    }

    function repushMenuRegion() {
      // 菜单弹出/换视图/收起都要重推窗口形状，否则那块不在 region 里。
      // 立即推 + 60ms 后再确认一次：换视图时面板宽高立刻变了，
      // 而 getBoundingClientRect 量的是最终盒子，所以这里不需要等过渡。
      if (typeof pushSilhouette === 'function') pushSilhouette(true);
      if (typeof pushSilhouette === 'function') setTimeout(function() { pushSilhouette(true); }, 60);
    }

    /** 切换菜单视图：main（主菜单）/ tick（检测周期二级面板）。
     *  两个视图共用 #contextMenu 这个面板，靠 hidden 切换 —— 另起面板不在
     *  collectUiRects() 的 region 里（它只认 #contextMenu 这个 id）。 */
    function showMenuView(view) {
      var main = document.getElementById('menuMain');
      var tick = document.getElementById('menuTick');
      if (!main || !tick) return;
      var isTick = (view === 'tick');
      main.hidden = isTick;
      tick.hidden = !isTick;
      contextMenu.setAttribute('data-view', isTick ? 'tick' : 'main');
      if (isTick) renderDetectLabels();
    }

    function hideMenu() {
      contextMenu.classList.remove('show');
      if (typeof pushSilhouette === 'function') pushSilhouette(true);
    }

    // -------- 检测周期 --------
    function clampDetect(sec) {
      if (!isFinite(sec)) return detectSec;
      return Math.max(detectMin, Math.min(detectMax, Math.round(sec)));
    }

    function renderDetectLabels() {
      var txt = detectSec + ' 秒';
      var v = document.getElementById('tickValue');
      var s = document.getElementById('tickStepVal');
      if (v) v.textContent = txt;
      if (s) s.textContent = txt;
      var chips = document.querySelectorAll('#tickChips .chip');
      for (var i = 0; i < chips.length; i++) {
        var sec = parseInt(chips[i].getAttribute('data-sec'), 10);
        chips[i].classList.toggle('active', sec === detectSec);
      }
    }

    /** 改周期：先本地渲染（点击要有立刻的反馈），再 POST 落盘。
     *  真正生效的是扩展 —— 它 watch 这个设置文件，改完约 1 拍内切到新周期。
     *
     *  ⚠️ 0.3.41 —— 服务端是 **多线程** 服务器（ThreadingHTTPServer），
     *  响应**不保证按发出顺序返回**。之前这里和 syncDetectSec 都是
     *  fire-and-forget、谁先回来谁生效，于是：右键开菜单（发 GET）后立刻点
     *  chip（发 POST），若 POST 先被处理完，随后那个读到旧值的 GET 回来会
     *  把界面**弹回旧值**——而服务端其实已经是新值了，界面开始说谎。
     *  统一用自增 seq：只接受"我发出时序号最大的那个"响应。 */
    var settingsSeq = 0;
    var detectPostTimer = null;
    var pendingDetectSec = null;
    // 上一次**确认落盘**的周期值 = 失败回滚的基准（0.3.44）。
    // 以前用"一次连点 burst 的起点"当基准（burstPrev），可只要用户停 >150ms
    // 再点，pendingDetectSec 已被清空 → 新 burst 记的"起点"是**没落盘的
    // 乐观值**（31），而磁盘上其实还是 30。回滚到 31 之后：界面 31、磁盘 30、
    // 气泡说"没保存成功" —— 三个值互不相同。改成盯"最后一次服务端确认的值"，
    // 无论中间连点多少下、间隔多久，回滚目标永远是磁盘上真实生效的那个。
    var diskDetectSec = detectSec;

    function detectFailed(prev, seq) {
      if (seq !== settingsSeq) return;   // 已经有更新的操作了，别抢它的结果
      detectSec = prev;                  // 回滚，别让界面停在一个假值上
      renderDetectLabels();
      repushMenuRegion();
      try { showBubble('周期没保存成功…再试一次？', true); } catch (e) {}
    }

    function postDetectSec(sec, prev) {
      var seq = ++settingsSeq;
      try {
        fetch(SETTINGS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ detectIntervalSec: sec })
        }).then(function(r) { return r.json(); }).then(function(d) {
          if (seq !== settingsSeq) return;
          if (!d) { detectFailed(prev, seq); return; }
          if (isFinite(d.min)) detectMin = d.min;
          if (isFinite(d.max)) detectMax = d.max;
          // ⚠️ 200 不等于落盘成功：save_settings 写文件失败时返回
          // `saved:false`（比如 ~/.dsh/pets 只读、os.replace 失败）。以前
          // 不看这个字段 → 界面显示成功，桌宠行为纹丝不动，下次右键打开
          // 菜单又被 syncDetectSec 弹回旧值，用户以为"设置自己跳回去了"。
          if (d.saved === false) { detectFailed(prev, seq); return; }
          // 落盘成功 → 这个值成为新的回滚基准（以服务端夹过的值为准）
          diskDetectSec = isFinite(d.detectIntervalSec)
            ? clampDetect(d.detectIntervalSec) : sec;
          // 服务端才是权威（它夹过值）：不一致就对齐回来，别让界面说谎
          if (isFinite(d.detectIntervalSec)) {
            var v = clampDetect(d.detectIntervalSec);
            if (v !== detectSec) { detectSec = v; renderDetectLabels(); repushMenuRegion(); }
          }
        }).catch(function() { detectFailed(prev, seq); });
      } catch (err) { detectFailed(prev, seq); }
    }

    function setDetectSec(sec) {
      var next = clampDetect(sec);
      if (next === detectSec) return;
      // ⚠️ 一有新的点击就作废所有在途响应（0.3.44）。序号以前只在
      // postDetectSec 里自增，而那里离真正发请求还隔着一个 150ms 防抖：
      //   · 上个 burst 的 POST 在这 150ms 内失败 → detectFailed 的
      //     `seq !== settingsSeq` 拦不住（序号还没变）→ 界面被回滚到旧值、
      //     还冒一条"周期没保存成功"，可新一轮其实存成功了（数字先跳一下再回来）；
      //   · 菜单打开时的 GET 同样在这 150ms 内返回 → 把刚点的乐观值打回旧值。
      // 在**变更发生的第一时间**自增，两条在途响应就都过期了。
      settingsSeq++;
      detectSec = next;
      renderDetectLabels();
      repushMenuRegion();      // 「1 秒」比「30 秒」窄，面板宽度变了就要重推 region
      // 连点「+」时每一下都会发一个 POST（10 连点 = 10 个并发写），最后落在
      // 界面上的值取决于哪个响应最后到，和服务端最终值可能不一致。合并成
      // 150ms 一次，只提交最后一次的值。
      pendingDetectSec = next;
      if (detectPostTimer) clearTimeout(detectPostTimer);
      detectPostTimer = setTimeout(function() {
        detectPostTimer = null;
        var target = pendingDetectSec;
        pendingDetectSec = null;
        if (target === null) return;
        // 回滚基准永远是"最后确认落盘"的值，不传 null 也不传乐观值
        postDetectSec(target, diskDetectSec);
      }, 150);
    }

    /** 打开菜单时用权威值复核一次缓存（页面里的值只是 load_html 注入的初值）。 */
    function syncDetectSec() {
      var seq = ++settingsSeq;   // 与 POST 共用序号：后发的才能覆盖先发的
      try {
        fetch(SETTINGS_URL).then(function(r) { return r.json(); }).then(function(d) {
          if (seq !== settingsSeq) return;   // 已经有更晚的请求了，丢弃这个旧答案
          if (!d) return;
          if (isFinite(d.min)) detectMin = d.min;
          if (isFinite(d.max)) detectMax = d.max;
          if (!isFinite(d.detectIntervalSec)) return;
          var v = clampDetect(d.detectIntervalSec);
          diskDetectSec = v;          // 服务端读到的就是磁盘上的值 → 回滚基准
          if (v !== detectSec) { detectSec = v; repushMenuRegion(); }
          renderDetectLabels();
        }).catch(function() {});
      } catch (err) {}
    }

    petArea.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      showMenuView('main');        // 每次右键都从主菜单开始
      renderDetectLabels();        // 先用缓存值渲染，别让标签空着等网络
      contextMenu.classList.add('show');
      menuAnchorX = e.clientX;
      menuAnchorY = e.clientY;
      positionMenu();
      // 菜单弹出后立刻重推窗口形状：否则菜单在 region 之外，被裁成"看不见的菜单"
      if (typeof pushSilhouette === 'function') pushSilhouette(true);
      // 过渡动画（180ms scale+translate）结束后再确认一次：上面的立即推送
      // 量到的是 scale(0.92) translateY(-4px) 的中途盒子，比最终位置小一圈，
      // 菜单边缘会被 region 短暂裁掉 —— 和气泡 popUp 是同一类问题（第十一轮）。
      // 周期轮询最迟 500ms 会纠正，但与其靠运气不如显式确认。
      if (typeof pushSilhouette === 'function') setTimeout(function() { pushSilhouette(true); }, 230);
      syncDetectSec();
    });
    document.addEventListener('click', function() {
      if (!contextMenu.classList.contains('show')) return;
      hideMenu();
    });
    // 屏蔽 frameless 窗口里的浏览器默认右键菜单（头像区已有自定义菜单）
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    contextMenu.addEventListener('click', function(e) {
      // 用 closest 而不是 e.target.getAttribute：二级菜单的条目里有 <span>
      // 子节点（如「检测周期 ▸」的箭头），点到子节点时 target 不是带
      // data-action 的那个元素，直接取会拿到 null → 整个菜单静默失效。
      var el = (e.target && e.target.closest) ? e.target.closest('[data-action]') : null;
      var a = el ? el.getAttribute('data-action') : null;

      if (a === 'open-tick' || a === 'back') {
        showMenuView(a === 'open-tick' ? 'tick' : 'main');
        positionMenu();            // 换视图后面板尺寸变了，重新收敛进窗口
        repushMenuRegion();
        // 必须掐断冒泡：document 上的 click 监听会顺手把菜单关掉
        // （换视图/连点步进时菜单得留着）
        e.stopPropagation();
        return;
      }
      if (a === 'tick-dec' || a === 'tick-inc' || a === 'tick-set') {
        if (a === 'tick-dec') { setDetectSec(detectSec - 1); }
        else if (a === 'tick-inc') { setDetectSec(detectSec + 1); }
        else { setDetectSec(parseInt(el.getAttribute('data-sec'), 10)); }
        e.stopPropagation();       // 同上：连续调值时菜单不能被关掉
        return;
      }

      // 其余（含 exit）都是"点完就收起"
      if (a === 'edit-corpus') {
        // ⚠️ 在途去重（0.3.43）：hideMenu() 只移除 .show，而菜单的
        // `transition: visibility 0.18s` 在过渡期间按规范**仍保持 visible**，
        // 参与命中测试的也不是 opacity —— 这 180ms 内元素照样能点，双击的
        // down-up-down-up 完全够。于是同一个请求发两次：后端每次请求都新起
        // 一个 worker，扩展只回执最大的 seq，先发那个 slot 永远等不到回执
        // → 2.5s 后走 code / os.startfile 回落 → 同一个语料文件被两个程序
        // 各打开一次（两边都能写，谁后保存谁覆盖），还多冒一条气泡。
        if (corpusOpenBusy) { hideMenu(); return; }
        corpusOpenBusy = true;
        // ⚠️ 解锁靠**时间窗**，不靠请求回调（0.3.44）。0.3.43 是在 fetch 的
        // .then/.catch 里置回 false 的，可那个 POST 在 Python 侧是"登记
        // slot → 落盘 → 起线程 → 立刻 200"，本机 RTT 只有 10~20ms ——
        // 守卫的存活期比它要防的 180ms 菜单过渡窗口还短，双击的第二下
        // 照样能打进来。所以固定按住 700ms（> Windows 双击间隔上限 ~500ms，
        // < 后端 2.5s 的回执超时），回调不再碰这个标志。
        setTimeout(function() { corpusOpenBusy = false; }, 700);
        // 只发请求，不在这里冒泡说话 —— 真正打开成功/失败由 Python 那边
        // 决定（它要等扩展回执、还可能回落），由它推**唯一一条**结果气泡。
        // 这里先说一句就是两条气泡同时冒（MAX_BUBBLES=2）。
        try {
          fetch(SETTINGS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ openCorpus: true })
          }).then(function(r) { return r.json(); }).then(function(d) {
            // 请求**到达** Python 时由它推结果气泡（它要等扩展回执、还可能
            // 三层回落）；但请求压根没到达（服务不可达 / 被 CORS 护栏挡掉）
            // 时 Python 那边什么都不会发生 —— 菜单收起、然后一片死寂，
            // 用户只能反复点，前后端日志里都零痕迹。这条气泡就是补这个洞。
            if (d && d.ok === false) { showBubble('没能打开语料文件…', true); }
          }).catch(function() {
            try { showBubble('没能打开语料文件…', true); } catch (e) {}
          });
        } catch (err) {}
      }
      if (a === 'exit') {
        try { if (window.pywebview && window.pywebview.api) window.pywebview.api.exit_app(); } catch (err) {}
      }
      hideMenu();
    });

    // ============ 气泡自动消失 ============
    setInterval(function() {
      var bubbles = bubbleArea.querySelectorAll('.bubble:not([data-removing])'), now = Date.now();
      bubbles.forEach(function(b) {
        if (!b.dataset.created) b.dataset.created = now;
        if (now - parseInt(b.dataset.created) > 8000) {
          removeBubble(b);
        }
      });
    }, 2000);

    // ============ 启动 ============
    connectSSE();
    initLive2D();
    startSilhouetteLoop();

    // ============ 桥自检：证明 JS -> pywebview -> Python 这条路通不通 ============
    // pywebview.api 是异步注入的：可能在脚本执行时就绪，也可能晚一点
    // （触发 pywebviewready 事件）。两头都试，哪头先通走哪头。
    function bridgeSelfTest(tag) {
      try {
        var api = window.pywebview && window.pywebview.api;
        if (!api || !api.ping) {
          reportJS('bridgePing', { ok: false, at: tag, err: 'api 未就绪' });
          return;
        }
        Promise.resolve(api.ping()).then(function(res) {
          reportJS('bridgePing', { ok: !!(res && res.ok), at: tag, pid: res && res.pid });
        }, function(err) {
          reportJS('bridgePing', { ok: false, at: tag, err: String(err) });
        });
      } catch (e) {
        reportJS('bridgePing', { ok: false, at: tag, err: String(e) });
      }
    }
    bridgeSelfTest('immediate');
    window.addEventListener('pywebviewready', function() { bridgeSelfTest('pywebviewready'); });

    // ============ JS 心跳（第十轮诊断）============
    // 每 2s 通过桥拍一次心跳，Python 侧记时间戳。定时器被节流/页面被冻结时
    // 心跳滞后会被 standalone 写进日志 —— 上一轮"气泡被 region 永久裁掉一截"
    // 的元凶（页面定时器停摆 → region 停在过期形状）就是靠这个才能在日志里
    // 看见，否则整条链路又是静默的。
    setInterval(function() {
      try {
        var hbApi = window.pywebview && window.pywebview.api;
        if (hbApi && hbApi.pet_heartbeat) { hbApi.pet_heartbeat(); }
      } catch (e) { /* 心跳失败不影响主流程 */ }
    }, 2000);
  </script>
</body>
</html>
