<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --accent: #ff6b9d;
      --accent-dim: #c04a78;
      --accent-glow: rgba(255, 107, 157, 0.45);
      --purple: #c084fc;
      --text: #eef0f6;
      --muted: #8888aa;
      --error-border: #ff4757;
      --bubble-bg: #1a243c;   /* ⚠️ 必须不透明：region 里露出的 Form 底是黑的，
                                 半透明气泡会跟黑底混出一圈暗边（第七轮"黑边"） */
      --hair: #f8a4c2;
      --hair-dark: #e8789a;
      --skin: #ffe4d0;
      --eye: #5b3a6e;
      --blush: #ffb3c1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      user-select: none; -webkit-user-select: none;
      /* 透明窗口上必须显式关掉次像素（ClearType）抗锯齿。
         次像素渲染要求底是不透明的；页面底是透明的时候，Chromium 会把这块
         文字的栅格化缓冲区按不透明处理 —— 表现就是**文字背后出现一块与文字同宽
         的浅色方块**（用户在 WebView2 里看到的"块状白色"）。
         关掉之后走灰度抗锯齿，字形边缘会稍微软一点点，换掉那块方块很值。
         ⚠️ headless Chrome 本来就禁用次像素抗锯齿，所以这条在探针里看不出差别，
         只能在真实 WebView2 上验证。 */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 8px 12px;
    }

    /* ===== 气泡区域 ===== */
    .bubble-area {
      width: 100%; max-width: 264px;
      flex-shrink: 0;   /* 空间不足时宁可溢出窗口（fitBubbles 会裁旧气泡），
                           也绝不被 flex 压扁 —— 压扁就是把字揉在一起 */
      display: flex; flex-direction: column;
      align-items: center; gap: 7px;
      margin-bottom: 8px;
      pointer-events: none;
      /* 方向必须是 column（不是 column-reverse）：appendChild 的最新气泡
         落在**最下面、贴着角色**，尾巴（::after 朝下）正好指向角色 ——
         旧写法 column-reverse 会把最新气泡顶到最上面，尾巴指着下面那条
         旧气泡，视觉是错的；而且溢出被切的是**最新**那条（第十轮截图）。 */
    }
    .bubble {
      position: relative; max-width: 100%;
      flex-shrink: 0;   /* 同上：不许被压扁 */
      padding: 9px 15px; border-radius: 14px;
      border: 1px solid transparent;
      background:
        linear-gradient(var(--bubble-bg), var(--bubble-bg)) padding-box,
        /* 边框渐变必须用不透明色：这里原来写 rgba(...,0.55) 之类，
           在黑底 Form 上会混成暗边（第七轮"黑边"的来源之一）。
           三个色值就是原 rgba 各自「混在黑底上」的等效不透明色，观感不变。 */
        linear-gradient(135deg, #8c3b56, #432e58, #33151f) border-box;
      /* ⚠️ 这里曾经有一行 backdrop-filter: blur(10px)。
         在**透明窗口**上它是有害的：backdrop-filter 要找"背后有什么"来做模糊，
         而窗口背后是桌面、不在这张合成图里 —— Chromium 会退化成给这层糊一块
         不透明的底，用户看到的就是对话框后面多一块浅色方块。
         气泡本身已经是 92% 不透明，这层模糊既看不出效果、又制造问题，故删除。 */
      /* 排版（第九轮）：13px/1.7 + 0.5px 字距是中文气泡的可读下限，
         12px 挤在一起显得局促。max-height 是兜底——超长回复最多显示约 5 行，
         宁可在气泡自己的圆角内截断，也不能让气泡顶出窗口上沿被切。 */
      font-size: 13px; line-height: 1.7; letter-spacing: 0.5px;
      max-height: 132px; overflow: hidden;
      white-space: pre-wrap; word-break: break-word;
      text-align: center;
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(255, 107, 157, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      pointer-events: auto;
    }
    /* 气泡顶部高光条 */
    .bubble::before {
      content: ''; position: absolute;
      top: 1px; left: 14px; right: 14px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      border-radius: 1px;
    }
    /* 气泡尾巴：必须不透明（半透明的尾巴在黑底 Form 上混成近黑色块）。
       颜色 = --bubble-bg，跟气泡底同色，接缝处才连续。 */
    .bubble::after {
      content: ''; position: absolute; bottom: -7px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid var(--bubble-bg);
    }
    .bubble.error {
      background:
        linear-gradient(#37141c, #37141c) padding-box,
        linear-gradient(135deg, #b3323d, #592a23) border-box;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.4),
        0 0 24px rgba(255, 71, 87, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), shake 0.35s 0.38s ease;
    }
    .bubble.error::after { border-top-color: #37141c; }
    .bubble.old {
      opacity: 0.45; transform: scale(0.92);
      transition: all 0.5s ease;
      /* 这里原本还有 filter: saturate(0.6)。filter 会把元素提升成独立合成层，
         透明窗口上这类层有可能连底一起被栅格化成不透明 —— 为了不冒这个险删掉，
         降饱和的效果本来就被 opacity:0.45 盖过了，看不出来。 */
    }
    .bubble.fade-out {
      opacity: 0; transform: translateY(-8px) scale(0.85);
      transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes popUp {
      from { opacity: 0; transform: translateY(14px) scale(0.8); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* ===== 角色立绘区（拖拽手柄） ===== */
    .character-wrapper {
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
      flex-shrink: 0;   /* 气泡变高时立绘不许被压扁 */
      cursor: grab; padding: 6px;
      border-radius: 16px; transition: background 0.25s;
    }
    .character-wrapper:active { cursor: grabbing; }
    .character-wrapper:hover { background: rgba(255,107,157,0.05); }

    /* 角色容器 */
    .character-box {
      width: 160px; height: 210px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      animation: idleSway 4s infinite ease-in-out;
    }
    /* 角色背后柔光 */
    .character-box::before {
      content: ''; position: absolute;
      width: 140px; height: 140px;
      left: 50%; bottom: 15px; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255,107,157,0.10) 0%, rgba(192,132,252,0.05) 45%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes idleSway {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(0.5deg); }
      75% { transform: translateY(-2px) rotate(-0.5deg); }
    }

    /* ===== 角色底板：蓝色水族箱（第五轮重做）=====
       这个模型自带不少纯白美术：白色蕾丝女仆头饰、白色书桌板、巴菲上的奶油。
       垫一张紧贴角色**实测外接框**的底板，碎白就并进同一张底里、边界消失。
       第四轮垫的是白卡；用户看过之后要的是"蓝色水族箱的环境"，于是第五轮
       把这张卡做成一缸水：缸壁 + 水面高光 + 斜射光柱 + 沙地 + 上浮气泡。
       - 位置/大小由 JS 按 canvas 的 alpha 实测给出（"最小"=实测框+内边距，
         不是写死 .character-box 的 160x210 —— 那比角色本身大一圈）
       - position: fixed + z-index:0：必须落在 canvas(z-index:1) 之下，
         否则会把角色盖住；fixed 让 bbox 可以直接用视口坐标，无需换算
       - pointer-events:none：不能吃掉拖拽窗口的手势
       - 只在 Live2D 就绪后由 JS 加 body.card-on 才显示；图片/CSS 兜底角色
         时不显示（那时 z-index:0 会盖住 #charImg，反而更糟）
       - ⚠️ 不要用 filter / backdrop-filter / mix-blend-mode：透明窗口上
         filter 会把元素提升成独立合成层，层底有可能被栅格化成不透明；
         backdrop-filter 更糟（窗口背后是桌面，不在合成图里，必然退化成一块实底）。
         这一缸水全部只用渐变 + 边框，足够好看。 */
    .character-card {
      display: none;
      position: fixed; z-index: 0;
      border-radius: 16px;
      overflow: hidden;                       /* 光柱/沙地跟着缸壁圆角裁 */
      background: linear-gradient(180deg,
        #ddf4ff 0%, #a9def7 13%, #6ec4ea 36%,
        #3f97cf 63%, #2a6fa4 85%, #1b4c76 100%);
      /* 缸壁必须不透明：0.85 的玻璃沿在黑底 Form 上会混出暗环（第七轮"黑边"）。
         box-shadow 原来那个 1px 深色外圈画在 border-box 之外 —— 会被 region
         裁掉根本看不见，改成 inset 让它真的落在缸壁内侧。 */
      border: 2px solid #e4f6ff;
      box-shadow:
        inset 0 0 0 1px rgba(10, 44, 72, 0.55),
        inset 0 6px 22px rgba(0, 0, 0, 0.38);
      pointer-events: none;
    }
    body.card-on .character-card { display: block; }
    /* 水面高光：缸口第一层水被光打亮 */
    .character-card .tank-surface {
      position: absolute; left: 0; right: 0; top: 0; height: 24%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.06) 55%,
        rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }
    /* 斜射光柱：repeating-linear-gradient 就是水面上的光带 */
    .character-card .tank-rays {
      position: absolute; left: -30%; right: -30%; top: 0; height: 80%;
      background: repeating-linear-gradient(102deg,
        rgba(255, 255, 255, 0.17) 0px, rgba(255, 255, 255, 0.17) 7px,
        rgba(255, 255, 255, 0) 7px, rgba(255, 255, 255, 0) 32px);
      pointer-events: none;
    }
    /* 缸底沙地 */
    .character-card .tank-sand {
      position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
      background: radial-gradient(140% 120% at 50% 108%,
        rgba(255, 236, 184, 0.92) 0%, rgba(255, 228, 164, 0.4) 52%,
        rgba(255, 226, 160, 0) 78%);
      pointer-events: none;
    }
    /* 上浮气泡 */
    .character-card .tank-bubble {
      position: absolute; bottom: 2px;
      width: 6px; height: 6px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: radial-gradient(circle at 34% 30%,
        rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.12) 62%,
        rgba(255, 255, 255, 0) 100%);
      animation: tankBubbleUp 7.5s linear infinite;
      pointer-events: none;
    }
    @keyframes tankBubbleUp {
      0%   { transform: translateY(0) scale(0.6); opacity: 0; }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.9; }
      100% { transform: translateY(-150px) scale(1.1); opacity: 0; }
    }
    /* 变体：只描一圈玻璃边，缸内照旧透出桌面 */
    body.card-frame .character-card {
      background: transparent;
      overflow: visible;
      border: 1.5px solid rgba(180, 230, 255, 0.9);
      box-shadow: 0 0 14px rgba(140, 210, 255, 0.35);
    }
    /* frame 模式下缸内装饰全部隐藏（只留边框） */
    body.card-frame .character-card > * { display: none; }

    /* 地面阴影 */
    .ground-shadow {
      width: 90px; height: 14px;
      margin-top: -12px;   /* 上提贴近角色，名牌随之上移（布局紧凑化） */
      background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: shadowPulse 4s infinite ease-in-out;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.8; }
      25% { transform: scaleX(0.92); opacity: 0.6; }
      75% { transform: scaleX(0.95); opacity: 0.7; }
    }

    /* 氛围粒子 */
    .sparkle {
      position: absolute; width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0; pointer-events: none;
      z-index: 3;   /* 浮在 Live2D 舞台之上 */
      animation: twinkle 3.5s infinite ease-in-out;
    }
    .sparkle:nth-child(1) { left: 18px; top: 60px; animation-delay: 0s; }
    .sparkle:nth-child(2) { right: 14px; top: 45px; animation-delay: 1.2s; width: 3px; height: 3px; background: var(--purple); }
    .sparkle:nth-child(3) { left: 30px; top: 130px; animation-delay: 2.1s; width: 3px; height: 3px; }
    .sparkle:nth-child(4) { right: 26px; top: 115px; animation-delay: 0.7s; width: 5px; height: 5px; background: rgba(255,255,255,0.9); }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
      50% { opacity: 0.8; transform: translateY(-6px) scale(1); }
    }

    /* 自定义图片 */
    .character-box img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    /* ===== Live2D 舞台 =====
       绝对定位铺满角色容器。z-index 1 让氛围粒子（z-index 3）仍然浮在角色之上，
       跟原来「定位元素覆盖静态元素」的视觉关系保持一致。
       pointer-events:none 是关键：鼠标事件必须穿透到 .character-wrapper，
       否则 Live2D 的 canvas 会把拖拽窗口的手势吃掉。 */
    .live2d-stage {
      display: none;
      position: absolute; inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .live2d-stage.visible { display: block; }
    .live2d-stage canvas { display: block; }
    /* Live2D 模型自带呼吸与摆动，再叠加 CSS 的 idleSway 会变成双重晃动 */
    .character-box.live2d-active { animation: none; }

    /* ===== CSS 默认角色 ===== */
    .css-character { display: none; position: relative; width: 100%; height: 100%; }
    .css-character.visible { display: block; }

    /* 身体 */
    .chibi-body {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 55px;
      background: linear-gradient(180deg, #f8e0f0 0%, #e8d0e8 100%);
      border-radius: 20px 20px 25px 25px;
      border: 1.5px solid #d8b8d8;
      animation: breathe 3.2s infinite ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scaleY(1); }
      50% { transform: translateX(-50%) scaleY(1.025); }
    }
    /* 领结 */
    .chibi-body::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 16px; height: 8px;
      background: linear-gradient(135deg, var(--accent), #ff8fb3);
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(255,107,157,0.4);
    }

    /* 头部 */
    .chibi-head {
      position: absolute; bottom: 55px; left: 50%;
      transform: translateX(-50%);
      width: 68px; height: 78px;
      background: linear-gradient(180deg, #fff0e4 0%, var(--skin) 60%);
      border-radius: 35px 35px 30px 30px;
      border: 1.5px solid #e8c8b8;
    }
    /* 头发 */
    .chibi-hair {
      position: absolute; bottom: 52px; left: 50%;
      transform: translateX(-50%);
      width: 74px; height: 60px;
      background: linear-gradient(180deg, var(--hair-dark) 0%, var(--hair) 40%, var(--hair-dark) 100%);
      border-radius: 40px 40px 8px 8px;
      box-shadow: inset 0 4px 8px rgba(255,255,255,0.25), 0 2px 6px rgba(0,0,0,0.15);
    }
    /* 刘海 */
    .chibi-bangs {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 30px;
      background: var(--hair-dark);
      border-radius: 0 0 20px 20px;
    }
    /* 眼睛 */
    .chibi-eye {
      position: absolute; width: 18px; height: 20px;
      background: #fff; border-radius: 50%;
      border: 2px solid var(--eye);
      top: 28px;
      animation: blink 4.6s infinite;
      transform-origin: center;
    }
    .chibi-eye.left { left: 14px; }
    .chibi-eye.right { right: 14px; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.08); }
      98% { transform: scaleY(1); }
    }
    .chibi-eye::after {
      content: ''; position: absolute;
      width: 10px; height: 12px;
      background: radial-gradient(circle at 40% 35%, #7b5a8e 0%, var(--eye) 60%);
      border-radius: 50%;
      top: 3px; left: 50%; transform: translateX(-50%);
    }
    /* 眼睛高光 */
    .chibi-eye::before {
      content: ''; position: absolute;
      width: 5px; height: 5px;
      background: #fff; border-radius: 50%;
      top: 2px; left: 3px; z-index: 2;
      box-shadow: 6px 7px 0 -1.5px rgba(255,255,255,0.6);
    }
    /* 腮红 */
    .chibi-blush {
      position: absolute; width: 12px; height: 7px;
      background: radial-gradient(ellipse, var(--blush), transparent 75%);
      border-radius: 50%;
      top: 43px; opacity: 0.8;
    }
    .chibi-blush.left { left: 6px; }
    .chibi-blush.right { right: 6px; }
    /* 嘴 */
    .chibi-mouth {
      position: absolute; width: 8px; height: 4px;
      border-bottom: 2px solid #d4787a;
      border-radius: 0 0 8px 8px;
      top: 50px; left: 50%; transform: translateX(-50%);
    }

    /* ===== CSS 情绪变体（通过 data-emotion 切换） ===== */

    /* angry: 眉头倒竖 + 嘴巴变尖 */
    .character-box[data-emotion="angry"] .chibi-mouth {
      width: 6px; height: 5px;
      border-bottom: none;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      border-top: 5px solid #d4787a;
      border-radius: 2px;
      top: 49px;
    }
    .character-box[data-emotion="angry"] .chibi-eye { animation: none; }
    .angry-brow { display: none; }
    .character-box[data-emotion="angry"] .angry-brow {
      display: block; position: absolute;
      width: 14px; height: 2.5px; background: var(--eye);
      border-radius: 1px; top: 22px;
    }
    .character-box[data-emotion="angry"] .angry-brow.left {
      left: 10px; transform: rotate(-15deg);
    }
    .character-box[data-emotion="angry"] .angry-brow.right {
      right: 10px; transform: rotate(15deg);
    }
    /* angry 青筋 */
    .angry-vein { display: none; }
    .character-box[data-emotion="angry"] .angry-vein {
      display: block; position: absolute;
      font-size: 14px; top: 8px; right: 30px;
      color: #ff4757;
      animation: veinPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes veinPop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    /* happy: 嘴巴张开微笑 + 腮红更大 */
    .character-box[data-emotion="happy"] .chibi-mouth {
      width: 10px; height: 5px;
      border-bottom: 2px solid #e8788a;
      border-radius: 0 0 10px 10px;
      top: 50px;
    }
    .character-box[data-emotion="happy"] .chibi-blush {
      width: 15px; height: 9px; opacity: 1;
    }
    /* happy 星星眼 */
    .character-box[data-emotion="happy"] .chibi-eye::after {
      background: radial-gradient(circle at 40% 35%, #f0a0b8 0%, #e8789a 60%);
    }
    .character-box[data-emotion="happy"] .chibi-eye { animation: none; transform: scaleY(0.85); }

    /* surprised: 大眼睛 + 圆嘴（惊讶时不眨眼） */
    .character-box[data-emotion="surprised"] .chibi-eye {
      width: 21px; height: 23px;
      animation: none;
    }
    .character-box[data-emotion="surprised"] .chibi-eye::after {
      width: 8px; height: 10px; top: 5px;
    }
    .character-box[data-emotion="surprised"] .chibi-mouth {
      width: 10px; height: 9px;
      border: 2px solid #d4787a;
      border-radius: 50%;
      background: #e8788a;
      top: 48px;
    }

    /* greeting: 微妙笑容 */
    .character-box[data-emotion="greeting"] .chibi-mouth {
      width: 9px; height: 4px;
      border-bottom: 2px solid #d89098;
      border-radius: 0 0 9px 9px;
      top: 49px;
    }

    /* 情绪切换过渡 */
    .character-box .chibi-eye,
    .character-box .chibi-mouth,
    .character-box .chibi-blush {
      transition: all 0.3s ease;
    }

    /* ===== 名字和状态 ===== */
    /* 名牌底板：必须是一块**不透明**的板。原来名字/状态直接写在透明页面上，
       region 的矩形里除字形外全是黑底 Form —— 看着像一块方黑牌，四角还是直角。
       现在由页面自己画板（圆角 + 深蓝黑），region 按同圆角裁，与气泡同构。 */
    .pet-plate {
      display: flex; flex-direction: column; align-items: center;
      padding: 2px 12px 3px;
      margin-top: -6px;   /* 再往上拉，缩小与角色卡的间距 */
      /* 必须定位 + 抬 z-index：角色卡是 position:fixed;z-index:0 的**不透明**
         水族箱底板，按 CSS 绘制顺序会盖在所有静态元素之上。名牌是静态的，
         上面那句负 margin 又把它压进了卡的范围 —— 不抬起来的话，名牌上沿
         （边框 + 字号 13px 的顶部）会被卡直接吃掉，看成"名字被切了半截"。
         1 已够（高于卡的 0），且低于气泡（与名牌区域本来就不重叠）。 */
      position: relative; z-index: 1;
      border-radius: 10px;
      background: #161a2e;
      border: 1px solid rgba(255, 107, 157, 0.28);
      pointer-events: auto; cursor: default;
    }
    .pet-name {
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px;
      margin-top: 0;
      background: linear-gradient(135deg, #ff6b9d 20%, #c084fc 80%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      /* ⚠️ 这里曾经有一行 filter: drop-shadow(0 0 8px var(--accent-glow))。
         filter 会把元素提升成独立的合成层；在透明窗口上这一层的底如果没被
         正确清成透明，就会变成一块与文字同宽的浅色方块（就是用户截图里
         "Airi / online" 背后那一块）。
         那个 glow 只有 45% 透明度的粉光，肉眼几乎看不出，删掉零损失。 */
    }
    .pet-status {
      font-size: 10px; color: var(--muted);
      margin-top: 1px;
    }
    .pet-status .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #4ade80;
      margin-right: 4px; vertical-align: middle;
      box-shadow: 0 0 6px rgba(74,222,128,0.6);
      position: relative;
    }
    .pet-status .dot::after {
      content: ''; position: absolute;
      inset: -2px; border-radius: 50%;
      border: 1px solid rgba(74,222,128,0.5);
      animation: dotPulse 2s infinite ease-out;
    }
    @keyframes dotPulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .pet-status .dot.offline { background: #666; box-shadow: none; }
    .pet-status .dot.offline::after { display: none; }

    /* ===== 右键菜单 ===== */
    .context-menu {
      position: fixed;
      background: #161828;   /* 不透明：菜单现在并进 region，半透明会在黑底 Form 上发暗 */
      /* 同 .bubble：透明窗口上 backdrop-filter 会糊出一块不透明的底 */
      border: 1px solid rgba(255,107,157,0.25);
      border-radius: 10px; padding: 5px;
      min-width: 120px; z-index: 999;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55), 0 0 16px rgba(255,107,157,0.06);
      opacity: 0; visibility: hidden;
      transform: scale(0.92) translateY(-4px);
      transform-origin: top left;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.4, 0.64, 1), visibility 0.18s;
    }
    .context-menu.show {
      opacity: 1; visibility: visible;
      transform: scale(1) translateY(0);
    }
    .context-menu .menu-item {
      padding: 7px 12px; font-size: 12px;
      cursor: pointer; color: var(--text);
      border-radius: 7px;
      transition: background 0.15s, padding-left 0.15s;
    }
    .context-menu .menu-item:hover {
      background: rgba(255,107,157,0.16);
      padding-left: 15px;
    }
    .context-menu .menu-item:active {
      background: rgba(255,107,157,0.28);
    }

    /* ===== 右键菜单 ·「检测周期」二级面板（v0.3.28） =====
       两个视图共用同一个 #contextMenu 面板（见 HTML 里的注释：另起一个面板
       会被窗口 region 裁掉）。所以这里的样式都跟在 .context-menu 下面。 */
    .context-menu .menu-head {
      padding: 0 12px 5px; font-size: 10.5px; color: #8b90a6;
      letter-spacing: 0.02em;
    }
    .context-menu .menu-item.is-sub { display: flex; align-items: center; gap: 6px; }
    .context-menu .menu-val {
      margin-left: auto; color: #ff9ec2;
      font-variant-numeric: tabular-nums;
    }
    .context-menu .menu-arrow { color: #8b90a6; font-size: 10px; }
    .context-menu .menu-item.is-back {
      color: #8b90a6; font-size: 11px; padding: 3px 12px 6px;
    }
    .context-menu .menu-stepper {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 3px 10px 6px;
    }
    .context-menu .step-btn {
      width: 27px; height: 25px; line-height: 23px; text-align: center;
      font-size: 14px; cursor: pointer; color: var(--text);
      background: rgba(255,107,157,0.12);
      border: 1px solid rgba(255,107,157,0.22); border-radius: 7px;
      user-select: none; -webkit-user-select: none;
      transition: background 0.15s;
    }
    .context-menu .step-btn:hover { background: rgba(255,107,157,0.26); }
    .context-menu .step-btn:active { background: rgba(255,107,157,0.42); }
    .context-menu .step-val {
      font-size: 15px; font-weight: 600; color: #ff9ec2;
      font-variant-numeric: tabular-nums;
    }
    .context-menu .menu-chips {
      display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 3px;
    }
    .context-menu .chip {
      flex: 1 1 auto; min-width: 22px; text-align: center; padding: 3px 0;
      font-size: 11px; cursor: pointer; border-radius: 6px;
      color: var(--text); background: rgba(255,255,255,0.05);
      user-select: none; -webkit-user-select: none;
      transition: background 0.15s;
    }
    .context-menu .chip:hover { background: rgba(255,107,157,0.2); }
    .context-menu .chip.active { background: rgba(255,107,157,0.38); color: #fff; }

    /* ===== 减弱动效偏好 ===== */
    @media (prefers-reduced-motion: reduce) {
      .character-box, .sparkle, .chibi-eye, .chibi-body,
      .ground-shadow, .pet-status .dot::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 角色底板：一缸蓝色的水（位置/大小由 JS 按实测角色外接框给出，见 .character-card）
       缸内装饰纯 CSS 渐变，不用 filter（透明窗口上 filter 会出问题） -->
  <div class="character-card" id="charCard">
    <div class="tank-rays"></div>
    <div class="tank-surface"></div>
    <div class="tank-sand"></div>
    <span class="tank-bubble" style="left:12%"></span>
    <span class="tank-bubble" style="left:36%; width:4px; height:4px; animation-delay:1.7s"></span>
    <span class="tank-bubble" style="left:61%; animation-delay:3.3s"></span>
    <span class="tank-bubble" style="left:85%; width:5px; height:5px; animation-delay:5.1s"></span>
  </div>

  <!-- 气泡展示区 -->
  <div class="bubble-area" id="bubbleArea"></div>

  <!-- 角色立绘区（拖拽手柄） -->
  <div class="character-wrapper" id="petArea">
    <div class="character-box" id="charBox">
      <!-- 氛围粒子 -->
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <!-- Live2D 舞台（素材可用时接管角色位；失败则退回下面的图片/CSS 角色） -->
      <div class="live2d-stage" id="live2dStage"></div>
      <!-- 自定义图片（优先级最高） -->
      <img id="charImg" src="" alt="deepseek" style="display:none" />
      <!-- CSS 默认角色 -->
      <div class="css-character visible" id="cssChar">
        <div class="chibi-hair"></div>
        <div class="chibi-bangs"></div>
        <div class="chibi-head"></div>
        <div class="chibi-eye left"></div>
        <div class="chibi-eye right"></div>
        <div class="angry-brow left"></div>
        <div class="angry-brow right"></div>
        <div class="angry-vein">💢</div>
        <div class="chibi-blush left"></div>
        <div class="chibi-blush right"></div>
        <div class="chibi-mouth"></div>
        <div class="chibi-body"></div>
      </div>
    </div>
    <div class="ground-shadow"></div>
    <div class="pet-plate" id="petPlate">
      <div class="pet-name">deepseek</div>
      <div class="pet-status">
        <span class="dot" id="dot"></span><span id="statusLabel">connecting...</span>
      </div>
    </div>
  </div>

  <!-- 右键菜单。
       ⚠️ 两个视图（主菜单 / 检测周期）**必须共用这一个 #contextMenu 面板**：
       collectUiRects() 只按这个 id 把菜单并进窗口 region（且要带 .show），
       另起一个面板不在 region 里，会被裁成"看得见点不着"甚至整块不显示 ——
       和 0.3.25 那条"相对路径打到资产服务器"是同一类"看不见的故障"。
       视图用 hidden 切换，面板本身的 .show / 定位 / region 重推都不用变。 -->
  <div class="context-menu" id="contextMenu" data-view="main">
    <div class="menu-view" id="menuMain">
      <div class="menu-item" data-action="exit">退出 deepseek</div>
      <div class="menu-item is-sub" data-action="open-tick">
        <span>检测周期</span>
        <span class="menu-val" id="tickValue">30 秒</span>
        <span class="menu-arrow">▸</span>
      </div>
      <div class="menu-item" data-action="edit-corpus">编辑语料（台词库）</div>
    </div>
    <div class="menu-view" id="menuTick" hidden>
      <div class="menu-item is-back" data-action="back">‹ 检测周期</div>
      <div class="menu-stepper">
        <span class="step-btn" data-action="tick-dec">−</span>
        <span class="step-val" id="tickStepVal">30 秒</span>
        <span class="step-btn" data-action="tick-inc">+</span>
      </div>
      <div class="menu-chips" id="tickChips">
        <span class="chip" data-action="tick-set" data-sec="1">1</span>
        <span class="chip" data-action="tick-set" data-sec="2">2</span>
        <span class="chip" data-action="tick-set" data-sec="5">5</span>
        <span class="chip" data-action="tick-set" data-sec="10">10</span>
        <span class="chip" data-action="tick-set" data-sec="15">15</span>
        <span class="chip" data-action="tick-set" data-sec="30">30</span>
        <span class="chip" data-action="tick-set" data-sec="60">60</span>
      </div>
      <div class="menu-head">秒 · 1~60 · 立即生效</div>
    </div>
  </div>

  <script>
    var PORT = {{PORT}};
    var CHAR_IMG = "{{CHARACTER_IMAGE}}";
    var LIVE2D_ENABLED = {{LIVE2D_ENABLED}};
    // 用字符串比较而不是裸插值：万一这个模板标记没被 load_html 替换掉，
    // 裸插值会变成语法错误让整个页面挂掉，这样写只会安静地退化成 false。
    var SILHOUETTE = ("{{SILHOUETTE}}" === "true");
    // 角色底板模式：off / tight（紧贴角色的圆角卡）/ square（方卡）/ frame（只描白框）
    //             / all（连名牌一起包进同一张卡）
    var CHAR_CARD = "{{CHAR_CARD}}";
    if (["off", "tight", "square", "frame", "all"].indexOf(CHAR_CARD) < 0) {
      CHAR_CARD = "square";   // 与 live2d_assets.card_mode() 的默认值保持一致
    }
    var SSE_URL = 'http://127.0.0.1:' + PORT + '/events';
    var EVENT_URL = 'http://127.0.0.1:' + PORT + '/event';
    // 绝对地址（主服务器端口），理由同 EVENT_URL：页面是从**资产服务器**
    // 的动态端口加载的，相对路径 '/settings' 会打到资产服务器上 → 404。
    var SETTINGS_URL = 'http://127.0.0.1:' + PORT + '/settings';

    // ============ 检测周期（右键菜单可改） ============
    // 权威值在 Python 侧（standalone.settings，落盘 ~/.dsh/pets/）；
    // 这里只是一份缓存：页面加载时先按 load_html 注入的初值渲染，
    // 菜单打开时再 GET /settings 复核一次。
    var detectSec = 30, detectMin = 1, detectMax = 60;
    (function() {
      // parseInt + isFinite 而不是裸插值：万一 DETECT_INTERVAL_SEC 这个模板
      // 标记没被 load_html 替换掉，裸插值会让整段脚本语法错误、页面全挂；
      // 这样写只会安静地退化成默认 30（同 SILHOUETTE 的防御套路）。
      // 注：标记原文故意不在注释里出现 —— 它必须全文件只出现一次，
      // live2d_probe/test_pet_settings.py 有这条断言。
      var n = parseInt("{{DETECT_INTERVAL_SEC}}", 10);
      if (isFinite(n) && n > 0) detectSec = n;
    })();

    // ============ JS 黑匣子：任何前端错误都上报宿主日志 ============
    // 第六轮教训：用户报"点击没反应、也拖不动"时，前端到底活着没有完全不可知
    // —— region / pet_click / move_window 三条链零留痕，分不清是
    //    (a) 页面 JS 在启动中途崩了（后续全部不执行）
    //    (b) 事件根本没进页面（窗口层穿透）
    //    (c) 桥断了（事件到了，api 调用回不来）
    // 有了这条上报，(a) 会直接把错误原文写进 .airi-pet.log。
    function reportJS(kind, detail) {
      try {
        fetch(EVENT_URL, { method: 'POST',
                           headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ type: kind, payload: detail })
                         }).catch(function() {});
      } catch (e) {}
    }
    window.onerror = function(msg, src, line, col) {
      reportJS('jsError', { where: 'onerror', message: String(msg),
                            src: String(src || ''), line: line || 0, col: col || 0 });
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var r = e.reason;
      reportJS('jsError', { where: 'unhandledrejection',
                            message: String((r && r.message) || r) });
    });

    // DOM
    var bubbleArea = document.getElementById('bubbleArea');
    var charBox = document.getElementById('charBox');
    var charCard = document.getElementById('charCard');
    var charImg = document.getElementById('charImg');
    var cssChar = document.getElementById('cssChar');
    var live2dStage = document.getElementById('live2dStage');
    var dotEl = document.getElementById('dot');
    var statusLabel = document.getElementById('statusLabel');
    var petArea = document.getElementById('petArea');
    var contextMenu = document.getElementById('contextMenu');
    /* 第九轮：3 → 2。窗口一共 443px 高，气泡区只有 ~150px 空间，
       三条气泡必然把最旧的一条顶出窗口上沿 —— 被窗口边缘横向切开，
       用户看到的就是"字被揉在一起"（截图里上方那个碎气泡）。 */
    var MAX_BUBBLES = 2;
    var currentEmotion = 'idle';
    var emotionTimer = null;

    // ============ 情绪立绘切换 ============
    function setEmotion(emotion) {
      if (!emotion) return;
      if (emotion !== currentEmotion) {
        currentEmotion = emotion;
        charBox.setAttribute('data-emotion', emotion);

        // Live2D 接管时情绪交给模型表情。
        // 注意：这时候绝不能再走下面的图片分支 —— 那张不透明的 PNG 会从模型的
        // 透明区域透出来，看起来就是"两个角色叠在一起"。
        applyLive2DEmotion(emotion);

        // 尝试加载情绪对应图片
        if (!live2d.ready && CHAR_IMG && CHAR_IMG.length > 0) {
          var base = CHAR_IMG.replace(/(\.\w+)$/, '_' + emotion + '$1');
          var testImg = new Image();
          // ⚠️ 这两个回调是**异步**的，必须认领自己的那一次切换（0.3.42）：
          // 两条带不同情绪的消息间隔只要小于图片加载耗时（实测 100ms 间隔
          // 对上首次加载的 300~500ms 很容易），先发的那张慢图会**后到**，
          // 然后无条件把 charImg.src 写成自己的情绪 —— 于是 currentEmotion
          // 已经是 'happy'，画面上却是上一张 'greeting'，表情和文案对不上，
          // 而且没有后续纠正（要等 8 秒定时器才刷回默认图）。
          // onerror 同理：旧情绪图 404 的回调会把刚切好的新情绪打回默认图。
          var myEmotion = emotion;
          testImg.onload = function() {
            if (currentEmotion !== myEmotion) return;
            charImg.src = base;
            charImg.style.display = 'block';
            cssChar.classList.remove('visible');
          };
          testImg.onerror = function() {
            if (currentEmotion !== myEmotion) return;
            charImg.src = CHAR_IMG;
            charImg.style.display = 'block';
            cssChar.classList.remove('visible');
          };
          testImg.src = base;
        }
      }

      // 8 秒后恢复默认表情（连续同情绪消息也要重置计时，
      // 否则间隔小于 8s 的第二条很快会被上一条的计时打回 idle）
      clearTimeout(emotionTimer);
      emotionTimer = setTimeout(function() {
        currentEmotion = 'idle';
        charBox.setAttribute('data-emotion', 'idle');
        applyLive2DEmotion('idle');
        // 立绘也要切回默认图，否则会一直停留在情绪变体
        if (!live2d.ready && CHAR_IMG && CHAR_IMG.length > 0) charImg.src = CHAR_IMG;
      }, 8000);
    }

    // ============ 自定义图片加载 ============
    // 抽成函数：LIVE2D_ENABLED 时先不显示图片，等 Live2D 的结果再决定用哪个，
    // 免得先闪一下旧立绘、再被模型替换掉。
    function showImageCharacter() {
      if (!CHAR_IMG || CHAR_IMG.length === 0) return;
      charImg.onerror = function() {
        charImg.style.display = 'none';
        cssChar.classList.add('visible');
      };
      // ⚠️ CSS 角色要等图片**真的画出来**才撤（0.3.42）。
      // 以前这里在设 src 之前就 remove('visible')，而图片从设 src 到 decode
      // 完成之间（首帧几十~几百 ms；URL 挂起时一直持续到 onerror）
      // getBoundingClientRect() 是 0×0 —— alphaAt() 的 `fr.width < 1` 判定
      // 于是恒成真，handlePetClick 里 `alphaAt(...) < 24` 恒成立，
      // pet_click 一次都不调：**点角色完全没反应**，且前端零报错、日志零痕迹
      // （就是 alphaAt 注释里记的那个故障，只是触发条件换成"立绘还在加载"）。
      // 保留 cssChar 到 onload 之后，这段时间命中判定还能落到它身上。
      charImg.onload = function() {
        cssChar.classList.remove('visible');
      };
      charImg.src = CHAR_IMG;
      charImg.style.display = 'block';
    }

    // ============ Live2D 角色 ============
    // 素材缺失（LIVE2D_ENABLED=false）或任何一步失败 → 静默退回图片 / CSS 角色。
    // 外观只是外观，绝不该让桌宠起不来。
    //
    // 素材由 common.py 的本地静态服务器提供，与页面同源；走 file:// 的话
    // model3.json 引用的几十个文件会被 CORS 全部拦掉（实测）。
    var LIVE2D_MODEL_URL = '/pet-assets/ds-whale-girl/c_0120.model3.json';
    var live2d = { ready: false, failed: false, model: null, app: null };

    // 现有情绪 → 模型表情名。这个模型有 44 个表情，按 model3.json 里的中文 Name 匹配。
    // 引擎一次只挂一个表情，所以"开心兴奋 + 星星眼"这种组合取其中更能表达情绪的那个。
    var EMOTION_EXPRESSION = {
      idle: null,                 // 不戴表情，回到待机
      greeting: '开心兴奋',
      angry: '生气',
      happy: '星星眼',
      surprised: '感叹号'
    };

    function applyLive2DEmotion(emotion) {
      if (!live2d || !live2d.ready || !live2d.model) return;
      var name = EMOTION_EXPRESSION[emotion];
      try {
        if (name) {
          live2d.model.expression(name);
        } else {
          var em = live2d.model.internalModel.motionManager.expressionManager;
          if (em && typeof em.resetExpression === 'function') em.resetExpression();
          else live2d.model.expression();
        }
      } catch (err) { /* 表情失败不影响角色本身 */ }
    }

    // ---- 眨眼驱动 ----
    // 引擎自带的 eyeBlink 在这个模型上永远不会跑：它被
    //   motionUpdated || this.eyeBlink?.updateParameters?.(...)
    // 这个条件挡着，而本模型 8 个动作全是 Loop:true、idle 几乎每帧都在驱动参数，
    // 于是 motionUpdated 恒为真 —— 结果就是角色从不眨眼。
    //
    // 做法照抄 dsh-pet-live2d 的参考实现：加载时 eyeBlink:false，
    // 自己在 saveParameters() 之后那一帧写入。两个要点：
    //   1. 必须挂在 saveParameters 之后 —— 挂早了会被引擎自己的快照吃进基线，
    //      下一帧再叠一次，眼睛就永远睁不开了。
    //   2. 必须是 **乘** 而不是赋值 —— 表情可能已经把眼睛眯起来了，
    //      眨眼要能闭上"当前这个"眼睛，而不是把它强行撑开成 0。
    var BLINK_CLOSE_MS = 70, BLINK_HOLD_MS = 45, BLINK_OPEN_MS = 110;
    var BLINK_MIN_MS = 2200, BLINK_MAX_MS = 6400;
    var blinkAt = 0, blinkStart = 0;

    function installBlinkDriver(core) {
      if (!core || typeof core.saveParameters !== 'function') return;
      var idxL = -1, idxR = -1;
      try {
        // 按名字查参数只能走 _model.parameters.ids（字符串数组）；
        // 引擎包装层的 getParameterIndex(string) 传字符串永远 miss。
        var ids = Array.from(core._model.parameters.ids);
        idxL = ids.indexOf('ParamEyeLOpen');
        idxR = ids.indexOf('ParamEyeROpen');
      } catch (err) { return; }
      if (idxL < 0 || idxR < 0) return;

      var base = core.saveParameters.bind(core);
      var nextBlink = function(now) {
        return now + BLINK_MIN_MS + Math.random() * (BLINK_MAX_MS - BLINK_MIN_MS);
      };

      core.saveParameters = function() {
        base();
        try {
          var values = core._model.parameters.values;
          var now = performance.now();
          if (blinkAt === 0) blinkAt = nextBlink(now);
          if (blinkStart === 0 && now >= blinkAt) blinkStart = now;
          if (blinkStart === 0) return;

          var elapsed = now - blinkStart;
          var shut = BLINK_CLOSE_MS + BLINK_HOLD_MS;
          var open = 1;
          if (elapsed < BLINK_CLOSE_MS) open = 1 - elapsed / BLINK_CLOSE_MS;
          else if (elapsed < shut) open = 0;
          else if (elapsed < shut + BLINK_OPEN_MS) open = (elapsed - shut) / BLINK_OPEN_MS;
          else { blinkStart = 0; blinkAt = nextBlink(now); }

          if (open < 1) {
            // 眼睛已经全闭上了就别再乘（否则会跟"wink"之类的表情打架）
            if (values[idxL] > 0.2) values[idxL] *= open;
            if (values[idxR] > 0.2) values[idxR] *= open;
          }
        } catch (err) { /* 模型已销毁 */ }
      };
    }

    // ---- 加载 ----
    function injectScript(src) {
      return new Promise(function(resolve, reject) {
        var tag = document.createElement('script');
        tag.src = src; tag.async = false;
        tag.onload = function() { resolve(); };
        tag.onerror = function() { reject(new Error('script failed: ' + src)); };
        document.head.appendChild(tag);
      });
    }

    async function initLive2D() {
      if (!LIVE2D_ENABLED) { showImageCharacter(); return; }
      try {
        await injectScript('/vendor/live2dcubismcore.min.js');
        if (typeof window.Live2DCubismCore === 'undefined') throw new Error('Live2DCubismCore missing');
        await injectScript('/vendor/live2d-vendor.js');
        var vendor = window.__dshLive2dPetVendor;
        if (!vendor) throw new Error('renderer bundle missing');
        vendor.extensions.add(vendor.Live2DPlugin);
        vendor.configureCubismSDK({ memorySizeMB: 64 });

        // 用 clientWidth/Height 量尺寸而不是 getBoundingClientRect：
        // .character-box 上有 idleSway 的 rotate 动画，rect 会把旋转后的
        // 包围盒算进来，宽高各偏约 2px。clientWidth 不受 transform 影响。
        var W = Math.max(1, charBox.clientWidth);
        var H = Math.max(1, charBox.clientHeight);

        var app = new vendor.Application();
        await app.init({
          width: W, height: H,
          backgroundAlpha: 0,
          antialias: true,
          autoDensity: false,
          resolution: Math.max(2, window.devicePixelRatio || 1),
          preference: 'webgl',
          preserveDrawingBuffer: true
        });
        app.canvas.style.width = '100%';
        app.canvas.style.height = '100%';
        live2dStage.appendChild(app.canvas);

        var model = await vendor.Live2DModel.from(LIVE2D_MODEL_URL, {
          autoUpdate: true,
          autoHitTest: false,
          autoFocus: false,
          eyeBlink: false,          // 见上面的眨眼说明
          textureOptions: { lod: 'full' }
        });
        var intr = model.internalModel;
        var srcW = Math.max(1, (intr && intr.originalWidth) || model.width);
        var srcH = Math.max(1, (intr && intr.originalHeight) || model.height);

        app.stage.addChild(model);
        model.anchor.set(0.5, 0.5);
        model.scale.set(Math.min(W / srcW, H / srcH));
        model.position.set(W / 2, H / 2);

        installBlinkDriver(intr && intr.coreModel);

        live2d.model = model;
        live2d.app = app;
        live2d.ready = true;

        // 接管角色位
        charImg.style.display = 'none';
        cssChar.classList.remove('visible');
        charBox.classList.add('live2d-active');
        // ⚠️ 把这个 class 加上**之前**，showBubble() 很可能已经写过内联
        // animation（0.3.42）。顺序是这样的：initLive2D() 是 async，要注入
        // 两个 vendor 脚本、app.init、再加载 model3.json 加几十张贴图，通常
        // 几百 ms 到数秒；而 connectSSE() 更快，后端往往立刻推一句问候语 →
        // showBubble() → 那时 `contains('live2d-active')` 为假 → 守卫放行 →
        // 内联 animation 写上了。上面这段注释提到的"永不恢复"正是这条路径：
        // 内联优先级高于样式表，本行加的 class 管不住它，而守卫此后为真、
        // 再也不会进那个分支 —— 内联就永久留下，模型自带呼吸叠加 CSS
        // idleSway 变双重晃动，且 idleSway 带 rotate，character-box 的 rect
        // 每帧漂移，region 采样与角色卡外接框永远锁不定。
        charBox.style.removeProperty('animation');
        live2dStage.classList.add('visible');

        await model.motion('Idle', 0, vendor.MotionPriority.IDLE);
        applyLive2DEmotion(currentEmotion);

        // 诊断钩子：让自动化测试能读到真实状态（对齐 dsh 参考实现的
        // window.__dshLive2dPet，那边也是这么暴露的）。正常使用不依赖它。
        window.__airi = {
          live2d: live2d,
          currentEmotion: function() { return currentEmotion; }
        };
      } catch (err) {
        live2d.failed = true;
        // ⚠️ 这里是**半初始化**的清场（0.3.42）：ready=true 在前面就写上了，
        // 而 `await model.motion(...)` 抛错会直接跳到这个 catch。此刻
        // live2dStage 已 visible、charBox 已 live2d-active、模型已经挂在
        // canvas 上 —— 直接 showImageCharacter() 会把那张不透明 PNG 垫到
        // canvas 底下，模型透明区正好透出它，也就是上面注释里最怕的
        // "两个角色叠在一起"。必须先把"Live2D 已接管"的所有痕迹撤干净。
        live2d.ready = false;
        live2d.model = null;
        live2d.app = null;
        live2dStage.classList.remove('visible');
        charBox.classList.remove('live2d-active');
        charBox.style.removeProperty('animation');
        if (window.console && console.warn) {
          console.warn('[airi] Live2D unavailable, falling back to image character:', err);
        }
        showImageCharacter();
      }
    }

    // ============ 气泡逻辑 ============
    // 最近一次气泡集合变动（新增/开始消失）的时间戳。
    // popUp/fade-out 动画进行中 getBoundingClientRect 量到的是"位移+缩放"
    // 之后的盒子 —— 拿它当 region 就会把气泡顶边裁掉十几像素。
    var lastBubbleChangeAt = 0;

    function removeBubble(el) {
      if (el.dataset.removing) return;
      el.dataset.removing = '1';
      lastBubbleChangeAt = Date.now();
      el.classList.add('fade-out');
      setTimeout(function() {
        el.remove();
        // 气泡消失后窗口形状也得跟着收，否则原地会留一块空矩形
        if (typeof pushSilhouette === 'function') setTimeout(function() { pushSilhouette(true); }, 0);
      }, 450);
    }

    function pruneBubbles() {
      var bubbles = bubbleArea.querySelectorAll('.bubble:not([data-removing])');
      if (bubbles.length >= MAX_BUBBLES) {
        removeBubble(bubbles[0]);
      }
    }

    // 最新的之外全部标旧（降低透明度+微缩）。必须在**追加新气泡之后**调 ——
    // 旧实现放在 append 之前，pruneBubbles 刚删完只剩一条时永远标不上。
    function markOldBubbles() {
      var bs = bubbleArea.querySelectorAll('.bubble:not([data-removing])');
      for (var i = 0; i < bs.length - 1; i++) bs[i].classList.add('old');
    }

    // 气泡区顶边不许越过视口顶（留 6px 呼吸）。超了就从最旧的开始**立刻**移除
    // （不走 450ms 渐隐，等不起）—— 绝不让窗口边缘把气泡文字横向切成两截。
    // 只剩一条仍溢出时：把它的 max-height 压到可用高度内，在气泡自己的
    // 圆角里截断（overflow:hidden），同样不让窗口上沿切字。
    function fitBubbles() {
      var guard = 0;
      while (guard++ < 8) {
        var box = bubbleArea.getBoundingClientRect();
        if (box.top >= 6) return;
        // ⚠️ 先把"已经决定要消失"的情气泡立刻请走（0.3.43）。
        // .fade-out 只改 opacity/transform，**不脱离文档流** —— 那 450ms 里
        // 它照样占着高度，而下面的 bs 查询恰好把它排除了。于是这句
        // `bs[0].remove()` 删掉的是**刚出现的第二条**：用户看到最旧的一条
        // 优雅淡出、新的那条啪一下没了（可能只说到半句）。
        // 三条两行以上的连续消息就能复现（3×2 行 + 2×gap ≈ 206px >
        // 气泡区可用高度 ≈ 200px），MAX_BUBBLES=2 等于退化成只留一条。
        var dying = bubbleArea.querySelector('.bubble[data-removing]');
        if (dying) { dying.remove(); continue; }
        var bs = bubbleArea.querySelectorAll('.bubble:not([data-removing])');
        if (bs.length > 1) { bs[0].remove(); continue; }
        if (!bs.length) return;
        // 区域 bottom 由下方（角色卡/名牌）钉死不随溢出变化，
        // 可用高度 = bottom − 6px 顶部呼吸
        var avail = Math.floor(box.bottom - 6);
        if (avail > 60) bs[0].style.maxHeight = avail + 'px';
        return;
      }
    }

    // ---- 文案长度上限 ----
    // 气泡能显示多少字是**有物理上限**的：max-height:132px + 13px/1.7 的行高
    // ≈ 5~6 行，再多的字被 overflow:hidden 直接裁掉 —— 用户一行都看不到。
    // 但 typeText 是**按字定速**的（最少 16ms/字），于是"看不见的字"照样要
    // 一字一字打完：实测 5000 字要打 80 秒、50000 字要打 13.3 分钟（0.3.34），
    // 这段时间气泡被它占着，后面的话排不上号（MAX_BUBBLES=2）。
    // ⚠️ 这不是"外部攻击者才会踩"的理论风险：右键「编辑语料」是给用户自己
    //    用的（落点 ~/.dsh/pets/airi-pet-corpus.jsonc），在里面写一条长台词
    //    保存，桌宠就会照着念 —— 实测 5000 字 = 80 秒。
    var MAX_BUBBLE_CHARS = 200;

    /** 把文案裁到气泡显示得下的长度；非字符串先转成字符串（typeText 要
     *  用 length / charAt，数字和对象都没有这些方法）。 */
    function clipBubbleText(text) {
      if (typeof text !== 'string') { text = String(text); }
      if (text.length <= MAX_BUBBLE_CHARS) { return text; }
      // ⚠️ 不能切在代理对中间（0.3.43）：slice 按 UTF-16 **码元**走，第 200
      // 个码元正好是某个 emoji（💢/🐳 之类）的高位代理时，切出来的是孤立
      // 代理 —— 气泡里显示成 "�"，而且这个坏字符会一路进 SSE 帧
      // （standalone 的 _sse_safe 就是为它兜的）。退一码元即可。
      // 顺带：text.length 把 emoji 算 2，所以"200 字"实际可能只有 100 个
      // emoji —— 那是既有口径，不改。
      var cut = MAX_BUBBLE_CHARS;
      var code = text.charCodeAt(cut - 1);
      if (code >= 0xD800 && code <= 0xDBFF) { cut--; }
      return text.slice(0, cut) + '…（已省略 '
        + (text.length - cut) + ' 字）';
    }

    // 打字机效果：逐字显示，让气泡更生动
    function typeText(el, text) {
      var i = 0;
      var speed = Math.max(16, Math.min(38, Math.round(1100 / Math.max(text.length, 1))));
      (function type() {
        // 气泡已经被移除了（8 秒 TTL 到期 / 被新气泡挤掉）就别再往一个
        // 脱离文档的节点里打字 —— 长文案被打断时这里会空转好几分钟。
        if (!el.isConnected) { return; }
        if (i < text.length) {
          // ⚠️ 一次吞掉整个**码点**（0.3.44）。charAt 走的是 UTF-16 码元，
          // emoji 会被拆成"高位代理 + 低位代理"两帧：第一帧的孤立代理渲染
          // 成 "�"，下一帧才拼回去 —— 每个 emoji 都闪一下方块。
          // 0.3.43 只修了 clipBubbleText（存储侧），打字机这半边没跟上。
          var cp = text.charCodeAt(i);
          var step = 1;
          if (cp >= 0xD800 && cp <= 0xDBFF && i + 1 < text.length) {
            var lo = text.charCodeAt(i + 1);
            if (lo >= 0xDC00 && lo <= 0xDFFF) { step = 2; }
          }
          el.textContent += text.substr(i, step);
          i += step;
          setTimeout(type, speed);
        }
      })();
    }

    function showBubble(text, isError) {
      // 空文案不建气泡：只会留一块看不见的空 region 挂 8 秒（后端返回空 text 时）
      if (!text) return;
      text = clipBubbleText(text);   // 见 MAX_BUBBLE_CHARS：裁掉"看不见但要打几分钟"的部分
      pruneBubbles();
      var el = document.createElement('div');
      el.className = isError ? 'bubble error' : 'bubble';
      el.dataset.created = Date.now();
      // 先把**整段**文字放进去量出最终高度：打字机逐字显示时盒子高度保持不变，
      // 旧气泡不会被一路往上顶（用户截图里"互动过程很难看"的另一半原因）。
      el.textContent = text;
      bubbleArea.appendChild(el);
      lastBubbleChangeAt = Date.now();
      fitBubbles();
      markOldBubbles();
      // ⚠️ 宽度也必须锁（0.3.32 用户截图实锤）：清空文本后 shrink-to-fit
      //    的盒子会**塌缩成 padding 宽（~32px）**，0ms 后那次强制形状推送
      //    量到的就是这条窄条 —— 它一进 region，气泡就被裁成只剩中间两个
      //    字。正常情况下 540ms 的修正推送能救回来；但页面若在这 540ms 里
      //    被冻结（本次实锤：最后一次点击后 ~0.4s 定时器停摆，23s 后截图时
      //    窄条形状仍驻留），就永远没人纠正。高度在上一轮已锁，宽度是同一
      //    个坑的另一半 —— 两把锁都落下后，气泡从诞生第一帧起就是最终盒子，
      //    任何时刻被推上 region 都是对的。
      el.style.width = el.offsetWidth + 'px';     // border-box：offsetWidth 即整盒宽
      el.style.height = el.offsetHeight + 'px';   // 锁定高度再清空打字
      el.textContent = '';
      typeText(el, text);
      // 轻推角色
      // ⚠️ 只在**没有** Live2D 时才重设动画（0.3.39）：内联样式的优先级
      //    高于样式表，这三行会把 CSS:313 那条 `.character-box.live2d-active
      //    { animation: none; }` 彻底打穿而且**永不恢复**（Live2D 加载成功
      //    时加的 class 还在，但管不住内联）。后果正是那段 CSS 注释里写的
      //    "模型自带呼吸与摆动，再叠加 CSS 的 idleSway 会变成双重晃动"，
      //    而且 idleSway 带 rotate —— .character-box 的 rect 会随动画漂移
      //    （那段注释也说了：因此量尺寸要用 clientWidth 而不是 rect），
      //    于是角色卡外接框与窗口 region 的采样结果每帧都在变。
      if (!charBox.classList.contains('live2d-active')) {
        charBox.style.animation = 'none';
        charBox.offsetHeight;
        charBox.style.animation = 'idleSway 4s infinite ease-in-out';
      }
      // 气泡一出现就得进窗口形状，否则要等下一次轮询 —— 那一瞬间气泡会被 region 裁掉。
      // 必须显式传 true：setTimeout(fn, 0) 按规范是**不带参数**调用的，
      // 写成 setTimeout(pushSilhouette, 0) 并不会把 force 传成真值。
      // 此刻 CSS 动画还没跑第一帧，getBoundingClientRect 量到的是**最终位置** —— 形状正确。
      if (typeof pushSilhouette === 'function') setTimeout(function() { pushSilhouette(true); }, 0);
      // 动画结束（400ms）后再确认一次：盖掉周期轮询万一在动画中途推上去的
      // 过期形状（第十轮病灶：那之后页面一旦被冻结/节流，错误形状就永久驻留，
      // 表现为最新气泡的顶边被水平切掉一截、8 秒自动消失也停摆）。
      if (typeof pushSilhouette === 'function') setTimeout(function() { pushSilhouette(true); }, 540);
    }

    function setOnline(online) {
      dotEl.classList.toggle('offline', !online);
      statusLabel.textContent = online ? 'online' : 'offline';
    }

    // ============ SSE 连接 ============
    // EventSource 只对"网络断了/服务端关了连接"自动重连。一旦服务端回了
    // **不是 text/event-stream** 的响应（端口被别的进程占住时最常见：那个
    // 端口上的服务对 /events 回 404 或一段 HTML），浏览器会把连接置成
    // CLOSED 并**彻底停止重试** —— 之后一条消息都收不到，状态点恒为
    // offline，扩展推过来的话也进不了气泡，而且没有任何提示（onerror 只
    // 调了 setOnline(false)）。用户只能整个重启桌宠。
    // 所以这里必须自己盯 readyState 并带退避地重建。
    var sseInstance = null;
    var sseRetryTimer = null;
    var sseRetryDelay = 1000;
    // 已收到的最大事件 id（0.3.44）。浏览器**自动**重连会替我们带
    // Last-Event-ID，但下面那条手动重建路径是 `new EventSource(...)`，
    // 全新对象没有这个状态 —— 服务端于是按"全新连接"处理，把最近 20 条
    // 重播一遍，桌宠把说过的话再念一次。所以自己记住 id，重建时挂到
    // 查询串上（服务端 /events 认 ?after_seq=）。
    var lastSSESeq = 0;

    function scheduleSSERetry() {
      if (sseRetryTimer) return;                 // 已经在等了，别叠定时器
      sseRetryTimer = setTimeout(function() {
        sseRetryTimer = null;
        try { if (sseInstance) sseInstance.close(); } catch (e) {}
        connectSSE();
      }, sseRetryDelay);
      sseRetryDelay = Math.min(sseRetryDelay * 2, 15000);  // 退避，封顶 15s
    }

    function connectSSE() {
      // 续传点：首次连接（lastSSESeq=0）不带参数，服务端重播最近几条；
      // 手动重建时带上已知的最大 id，只补缺口。
      var url = lastSSESeq > 0
        ? (SSE_URL + '?after_seq=' + lastSSESeq)
        : SSE_URL;
      var es = new EventSource(url);
      sseInstance = es;
      es.onopen = function() {
        setOnline(true);
        sseRetryDelay = 1000;                    // 真的连上了就把退避重置
        fetch(EVENT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'desktopReady' }) }).catch(function() {});
      };
      es.onmessage = function(event) {
        // id 由服务端写在 `id:` 行里；空串/非数字时保持原值
        var eid = Number(event && event.lastEventId);
        if (isFinite(eid) && eid > lastSSESeq) { lastSSESeq = eid; }
        try {
          var msg = JSON.parse(event.data);
          if (!msg || !msg.type) return;
          // ⚠️ 这里**不能**兜底成 'idle'：emotion 一旦是字符串就永远是真值，
          // 下面 errorAlert 那句 `setEmotion(emotion || 'angry')` 就永远取
          // 不到 'angry' —— 红色错误气泡在抖，角色表情却纹丝不动（0.3.39
          // 实测：不带 emotion 的 errorAlert，实际传给 setEmotion 的是
          // 'idle'）。保持 null，让每个分支自己决定兜底值。
          var emotion = (msg.payload && msg.payload.emotion) || null;
          // payload 缺失/不是对象时以前是直接 `msg.payload.text` → 抛
          // TypeError 被下面的空 catch 吞掉：消息静默消失，用户看到"扩展说
          // 已推送但桌宠没说话"，日志里零痕迹。统一取一份安全的 payload。
          var pl = (msg.payload && typeof msg.payload === 'object') ? msg.payload : {};
          switch (msg.type) {
            case 'chatMessage': showBubble(pl.text || '', false); setEmotion(emotion || 'idle'); break;
            case 'errorAlert': showBubble(pl.text || '', true); setEmotion(emotion || 'angry'); break;
            case 'backendExit': setOnline(false); showBubble('deepseek 已离线…', true); break;
            case 'pythonMessage': if (pl.message) { showBubble(pl.message, false); setEmotion(emotion || 'idle'); } break;
          }
        } catch (e) {
          try { reportJS('sseBadMessage', String(e && e.message || e)); } catch (e2) {}
        }
      };
      es.onerror = function() {
        setOnline(false);
        // 2 = CLOSED：浏览器已经放弃，不会自己再试（见函数上方注释）
        if (es.readyState === 2) { scheduleSSERetry(); }
      };
      return es;
    }

    // ============ 拖拽移动 + 点击互动 ============
    // 两者共用同一次按下：拖拽是"按下并移动"，点击是"按下后原地松开"。
    // 不区分的话，每次想把窗口拖走都会顺手触发一次点击台词。
    //
    // ⚠️ 0.3.37 —— 这套状态机原来是 mouse 事件，dragging **只有
    // document.mouseup 一条复位路径**。而 move_window 是跨桥异步的
    // （JS → pywebview → Python → ctypes.MoveWindow），窗口跟不上光标：
    // 快速甩动、或拖到屏幕边缘（Python 侧 clamp_to_virtual_screen 会把窗口
    // 卡住而光标继续走）、或拖拽中 Alt+Tab 被别的窗口盖住 —— 松手那一刻光标
    // 常常已经在窗口之外，mouseup 被桌面/别的窗口吃掉，dragging 就**永远是
    // true**。之后不按任何鼠标键，只要光标经过桌宠，mousemove 照常
    // move_window，桌宠像被磁铁吸住一样跟着鼠标跑（"拖了一次就一直粘着"）。
    //
    // 根治办法是 **pointer capture**：按下时把后续所有 pointer 事件锁到
    // petArea，光标甩到窗口外（甚至屏幕外）也照样收得到 pointerup。
    // 再叠两道兜底：pointermove 里 buttons===0 复位（捕获没生效时也治得住
    // "粘鼠标"这个症状）、pointercancel 与 window blur 复位。
    var dragging = false, dragStartX = 0, dragStartY = 0, winStartX = 0, winStartY = 0;
    var downX = 0, downY = 0, moved = false;
    var dragPointerId = null;   // 已捕获的指针 id（捕获失败则为 null）
    // 每次按下的自增序号（0.3.42）：get_position() 是**跨桥异步**的，
    // 它的回填必须认领自己那一次按下，否则见 pointerdown 里的注释。
    var dragSeq = 0;
    var CLICK_SLOP = 5;   // 移动不超过这个像素数才算"点击"

    function endDrag(e) {
      // 原地松开 = 点击；拖过就不算
      if (dragging && !moved && e) { handlePetClick(e); }
      dragging = false;
      if (dragPointerId !== null) {
        try {
          if (petArea.hasPointerCapture && petArea.hasPointerCapture(dragPointerId)) {
            petArea.releasePointerCapture(dragPointerId);
          }
        } catch (err) {}
        dragPointerId = null;
      }
    }

    petArea.addEventListener('pointerdown', function(e) {
      if (e.button !== 0) return;
      dragging = true;
      moved = false;
      downX = e.clientX; downY = e.clientY;
      dragStartX = e.screenX; dragStartY = e.screenY;
      winStartX = window.screenX || 0; winStartY = window.screenY || 0;
      // 关键一步：把后续 pointer 事件锁到 petArea。没有它，光标跑出窗口后
      // 就再也收不到 up —— 那正是"桌宠粘鼠标"的根因。
      dragPointerId = (typeof e.pointerId === 'number') ? e.pointerId : null;
      if (dragPointerId !== null) {
        try {
          petArea.setPointerCapture(dragPointerId);
        } catch (err) {
          dragPointerId = null;   // 捕获失败：靠下面 buttons===0 那道兜底
        }
      }
      if (window.pywebview && window.pywebview.api) {
        try {
          var mySeq = ++dragSeq;
          var p = window.pywebview.api.get_position();
          // ⚠️ 不要用 `pos[0] || winStartX`：坐标**真的可以是 0**（拖拽钳制
          // 允许窗口贴到屏幕左/上边缘），而 0 是假值 —— 会被当成"没取到"
          // 丢掉，回退到 window.screenX，于是这一拖的起点错了、窗口跳一下。
          // 判断必须是"是不是数字"，不是"是不是真值"（0.3.38）。
          var applyPos = function(pos) {
            // ⚠️ 认领自己的那一次按下（0.3.42）：跨桥调用是异步的，而
            // move_window 本身也让窗口位置滞后于逻辑值。松手后很快再次按下
            // 时，上一次那个还在飞行的 promise 会在这时 resolve，把**上一次
            // 拖拽的起点**写进 winStartX/Y，盖掉刚算好的起点 —— 随后
            // pointermove 按这个错基准调 move_window，窗口当场跳一下（位移量
            // 约等于上一次拖拽的位移）。判断 dragging 也不够：快速连按两次
            // 时它又已经是 true 了，所以只能用序号。
            if (mySeq !== dragSeq) return;
            if (!pos) return;
            if (typeof pos[0] === 'number' && isFinite(pos[0])) winStartX = pos[0];
            if (typeof pos[1] === 'number' && isFinite(pos[1])) winStartY = pos[1];
          };
          if (p && typeof p.then === 'function') {
            p.then(applyPos, function() {});
          } else { applyPos(p); }
        } catch (err) {}
      }
      e.preventDefault();
    });

    petArea.addEventListener('pointermove', function(e) {
      if (!dragging) return;
      // 兜底：捕获没生效（或出了别的岔子）时，左键已经松开就立刻收手。
      // 这一条正好治"粘鼠标"的症状 —— 光标回到窗口上时 buttons 必为 0。
      if (e.buttons === 0) { dragging = false; return; }
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > CLICK_SLOP) moved = true;
      if (!moved) return;      // 还没越过阈值就别急着挪窗口
      try {
        if (window.pywebview && window.pywebview.api)
          window.pywebview.api.move_window(winStartX + e.screenX - dragStartX, winStartY + e.screenY - dragStartY);
      } catch (err) {}
      e.preventDefault();
    });

    petArea.addEventListener('pointerup', function(e) { endDrag(e); });
    // 系统抢走指针（触摸被取消、窗口失焦）时也要收手
    petArea.addEventListener('pointercancel', function() { endDrag(null); });
    // 最后一道：Alt+Tab 走开时别把拖拽状态留在半路
    window.addEventListener('blur', function() {
      if (dragging) { endDrag(null); }
      // ⚠️ 失焦也要收菜单（0.3.43）。窗口是 on_top=True，右键菜单会一直浮在
      // 最上层；而唯一的关闭路径是 **document 上的 click** —— 用户切到别的
      // 程序时那个 click 落在别的进程里，根本不触发，菜单就一直开着。
      // 回来后习惯性地点一下角色（正好在刚才右键的位置），就会命中菜单第一项
      // 「退出 deepseek」（它就压在光标下方 5~33px）：一次"看一眼菜单"变成
      // "桌宠自己没了"，而且用户完全没有因果线索。
      if (contextMenu.classList.contains('show')) hideMenu();
    });

    // ---- 命中判定：读 canvas 的 alpha ----
    // 这个模型没有声明 Cubism HitAreas，引擎的 hitTest() 用不了，
    // 所以直接问 WebGL：这个点上的像素到底是不是角色。
    // 能这么做的前提是 app.init 时开了 preserveDrawingBuffer —— 关掉的话
    // readPixels 只会读到一片空白。
    // 非 Live2D 时"角色"到底是哪个元素（图片立绘 / CSS Q 版人）。
    // 命中判定必须有这条兜底，理由见 alphaAt。
    function fallbackCharacterEl() {
      // ⚠️ `charImg.src` 有值不等于"图上得出来"（0.3.42）：decode 完成前
      // 它的外接框是 0×0，交给 alphaAt 会被 `fr.width < 1` 判掉 —— 那时
      // cssChar 还在（见 showImageCharacter），命中判定必须落到它身上。
      // 判据只能是 complete + naturalWidth，不能只看 src 是不是真值。
      if (charImg && charImg.style.display !== 'none' && charImg.src &&
          charImg.complete && charImg.naturalWidth > 0) {
        return charImg;
      }
      if (cssChar && cssChar.classList.contains('visible')) return cssChar;
      return null;
    }

    function alphaAt(clientX, clientY) {
      if (!live2d.ready || !live2d.app) {
        // 非 Live2D（素材缺失 → 图片立绘 / CSS 角色）时**没有 alpha 可读**。
        // 以前这里直接 return 0，于是 handlePetClick 里 `alphaAt(...) < 24`
        // 恒成立 —— 连 zoneAt() 那条 `return 'body'` 的兜底都到不了，
        // api.pet_click 一次都不会被调用：**点角色完全没反应**，而且前端
        // 零报错（是 return 不是异常）、日志里一行痕迹都没有。
        // 0.3.39 实测：非 Live2D 下点 canvas 正中，pet_click 调用 0 次，
        // 而同一时刻 zoneAt() 返回的是 'body' —— 意图与实现对不上。
        // 这条路径上用**角色元素的外接框**代替像素命中即可。
        var fb = fallbackCharacterEl();
        if (!fb) return 0;
        var fr = fb.getBoundingClientRect();
        if (fr.width < 1 || fr.height < 1) return 0;
        if (clientX < fr.left || clientX >= fr.right ||
            clientY < fr.top || clientY >= fr.bottom) return 0;
        return 255;
      }
      var canvas = live2d.app.canvas;
      var rect = canvas.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return 0;
      if (clientX < rect.left || clientX >= rect.right ||
          clientY < rect.top || clientY >= rect.bottom) return 0;

      // 与 characterRects() 走**同一条**读取路径，读的是同一份采样结论。
      // 以前这里是自己单点 readPixels：如果那个环境的默认帧缓冲没有真 alpha
      // （WebView2 windowed hosting 下有可能），它会恒返回 255 ——
      // 于是"点哪儿都算点到角色"。轮廓和命中必须用同一个可信来源。
      if (silAlphaMode === 'off') {
        // 'off' = gl 与 2d 两条路径都被判为不可信。以前这里在 'off' 时选
        // '2d' —— 而 '2d' 正是刚刚被判定"整张画布都是角色"的那条，于是
        // canvas 内任何坐标的 alpha 都接近 255，`alphaAt(...) < 24` 永不
        // 成立：角色周围的空白（水、桌面以外）点哪都说话，而同一时刻
        // pushSilhouette 因为 source='unreliable' 拒绝设 region，窗口还是
        // 一整块矩形 —— 与上面那条"两者必须一致"的注释正好相反。
        // 但不能简单 return 0（那样点击又整条失效）：此刻窗口就是矩形，
        // 按 canvas 矩形命中才和肉眼看到的形状一致。
        return 255;
      }
      var grid = readAlphaGrid(silAlphaMode === '2d' ? '2d' : 'gl');
      if (!grid) return 0;
      var gx = Math.min(grid.w - 1,
                        Math.max(0, Math.round((clientX - rect.left) / rect.width * grid.w)));
      // WebGL 的 y 轴朝上，DOM 的朝下，这里要翻
      var gy = Math.min(grid.h - 1,
                        Math.max(0, Math.round((1 - (clientY - rect.top) / rect.height) * grid.h)));
      return grid.buf[(gy * grid.w + gx) * 4 + 3];
    }

    // 点击落在角色的哪一段。Q 版坐姿：上面是头，中间是身体，下面是她趴着的桌面。
    //
    // ⚠️ 边界不是拍脑袋的"三分画布"，是**量出来的**（0.3.36，
    // live2d_probe/measure_region.py 读运行中桌宠的窗口 region 实测）：
    //   * 角色实际画在 canvas ry 0.11~0.83（角色卡就是按这个外接框贴的，
    //     卡 = y 202~353 / canvas y 179~390）—— canvas 最底部 17% 根本没有角色像素；
    //   * 旧边界 desk = ry>=0.85，整条带落在角色卡**下缘之外**的缝隙里，
    //     而缝隙不在窗口 region 内 → 点了直接穿透到下层窗口。
    //     也就是说 desk 台词一条都触发不了，点桌子只能得到 body 的台词
    //     （用户实测 09:03:05 pet_click #1 zone=body 就是这么来的）。
    //   * head/body 边界 0.45 保持不变（Q 版大头，头部约占上半 48%，没人抱怨过）。
    // 不确定桌面上沿画在哪一行时，点一下桌宠、看日志里的 ry 值就能校准
    // （pet_click 现在带 ry 落日志）。
    var ZONE_HEAD_MAX = 0.45;   // ry < 这个 = head
    var ZONE_DESK_MIN = 0.62;   // ry >= 这个 = desk（桌子是贴图里最宽的梯形，
                                // 占角色下半 ~29%；量法见 measure_region.py）

    function zoneFromRatio(ry) {
      if (ry < ZONE_HEAD_MAX) return 'head';
      if (ry < ZONE_DESK_MIN) return 'body';
      return 'desk';
    }

    function zoneAt(clientY) {
      if (!live2d.ready || !live2d.app) return 'body';
      var rect = live2d.app.canvas.getBoundingClientRect();
      var ry = rect.height > 0 ? (clientY - rect.top) / rect.height : 0.5;
      return zoneFromRatio(ry);
    }

    var clickBusy = false;

    function handlePetClick(e) {
      if (clickBusy) return;
      // 点到透明处 = 没点到角色，安静地什么都不做
      if (alphaAt(e.clientX, e.clientY) < 24) return;
      var api = window.pywebview && window.pywebview.api;
      if (!api || !api.pet_click) return;
      clickBusy = true;
      setTimeout(function() { clickBusy = false; }, 600);   // 防手抖连点
      // ry 一起上报：分区边界要是再需要校准，日志里直接有"你点的那一下
      // 落在 canvas 的百分之几"，不用再起探针量
      var ryLog = -1;
      try {
        var _rect = live2d.app && live2d.app.canvas &&
                    live2d.app.canvas.getBoundingClientRect();
        if (_rect && _rect.height > 0) ryLog = (e.clientY - _rect.top) / _rect.height;
      } catch (err) {}
      try {
        Promise.resolve(api.pet_click(zoneAt(e.clientY), ryLog)).then(function(res) {
          if (!res || !res.text) return;
          showBubble(res.text, false);
          if (res.emotion) setEmotion(res.emotion);
        }, function() {});
      } catch (err) {}
    }

    // ============ 异形窗口：把「角色轮廓 + 气泡 + 名字」的形状交给 Python ============
    // 为什么算在页面这边：只有页面知道角色实际画在哪儿（canvas 的 alpha 通道），
    // 也只有页面知道气泡的实时位置和高度。
    // Python 侧只负责把这个形状设成窗口 region —— 背景那一大块由此真正透出桌面。
    var SIL_INTERVAL = 500;      // ms
    var SIL_ALPHA_MIN = 32;      // 低于它算背景
    var SIL_COVERAGE_MAX = 0.70; // 角色像素占画布比例的上限
    // 阈值宁可选高：region 比角色大 -> 露出宿主 Form 的底色（很显眼）；
    // 比角色小 -> 只是边缘收细一点，根本看不出来。
    //
    // 上面这条 SIL_COVERAGE_MAX 是**判据**不是调参：角色绝不可能占满画布
    // 七成。一旦读数超过它，就说明这个环境的 alpha 根本不可信
    // （WebView2 windowed hosting 下 WebGL 默认帧缓冲可能被强制成不透明，
    //  readPixels 全 255 -> 整张画布都算"角色" -> region 等于整窗，
    //  用户看到的就是"完全没透明"）。这时必须换一条路径复核，
    //  绝不能把那个满画布的结果直接设成窗口形状。
    var silLastKey = '';
    var silDiagSent = 0;         // 诊断上报条数上限，别把日志刷爆
    var silFails = 0;
    var silNextAt = 0;           // 连续失败后退避，但**永不放弃**
    var silAlphaMode = 'gl';     // 实测哪些读取路径可信：'gl' / '2d' / 'off'
                                 // alphaAt()（点击命中）复用这个结论，两者必须一致，
                                 // 否则会出现"轮廓对但点哪儿都说话"或反过来的错配。

    function collectUiRects() {
      /* 第七轮："黑边"的彻底修法 —— region 从「矩形 + pad」升级成
         「与页面绘制**同形状**」：
           * 气泡        → 圆角矩形（rad=14，与 border-radius 一致）
           * 气泡尾巴    → 三角形多边形（14 宽 7 高，跟 ::after 逐像素对齐）
           * 名牌底板    → 圆角矩形（rad=10，板由 .pet-plate 自己画）
           * 角色卡      → 圆角矩形（rad=16，与 border-radius 一致）
           * 右键菜单    → 圆角矩形（rad=10，弹出/收起都重推形状）
         pad 全部归零：任何 pad 环里页面都没画东西，dark 模式下露的就是
         黑底 Form —— 这就是用户截图里的"黑边"。背景见
         common.py fix_window_background 的长注释（颜色键路线已弃用）。 */
      var out = [];
      var bubbles = bubbleArea.querySelectorAll('.bubble');
      for (var i = 0; i < bubbles.length; i++) {
        var rb = bubbles[i].getBoundingClientRect();
        if (rb.width < 1 || rb.height < 1) continue;
        out.push({ l: rb.left, t: rb.top, r: rb.right, b: rb.bottom, rad: 14 });
        // 气泡尾巴：::after 是 border 画的三角形，底边 14px、高 7px、尖朝下
        var cx = (rb.left + rb.right) / 2;
        out.push({ poly: [[cx - 7, rb.bottom], [cx + 7, rb.bottom],
                          [cx, rb.bottom + 7]] });
      }
      var plate = document.getElementById('petPlate');
      if (plate) {
        var rp = plate.getBoundingClientRect();
        if (rp.width > 1 && rp.height > 1) {
          out.push({ l: rp.left, t: rp.top, r: rp.right, b: rp.bottom, rad: 10 });
        }
      }
      // 角色底板是一张**实心卡**，必须并进窗口形状 —— 否则它会被 region 裁掉，
      // 表现成"卡只显示一部分"的怪样子。
      if (charCard && document.body.classList.contains('card-on')) {
        var cr = charCard.getBoundingClientRect();
        if (cr.width > 1 && cr.height > 1) {
          out.push({ l: cr.left, t: cr.top, r: cr.right, b: cr.bottom, rad: 16 });
        }
      }
      // 右键菜单：弹出时并进形状（否则被 region 裁成"看不见的菜单"），
      // 收起时 class 移除后这里自然就不再上报
      if (contextMenu && contextMenu.classList.contains('show')) {
        var cm = contextMenu.getBoundingClientRect();
        if (cm.width > 1 && cm.height > 1) {
          out.push({ l: cm.left, t: cm.top, r: cm.right, b: cm.bottom, rad: 10 });
        }
      }
      return out;
    }

    // ============ 角色底板 ============
    // 把角色的实测外接框（来自 canvas 的 alpha 扫描）变成一张卡的位置和大小。
    // "最小" 就体现在这里：卡跟着角色真实画出来的范围走，不是 .character-box
    // 那个写死的 160x210（那比角色本身大一圈，白边会很显眼）。
    var CARD_PAD = 10;    // 外接框再放一圈，别把抗锯齿边缘切掉
    var CARD_PAD_ALL = 14;  // 连名牌一起包时留宽一点，文字别贴着卡边
    var CARD_SAMPLES = 6; // 前 6 次取样（约 3 秒）取并集后**锁定**，见下面的说明
    var CARD_MAX_FAILURES = 20;  // 视口取不到时的重试上限，见 updateCharCard
    var cardUnion = null;
    var cardSamples = 0;
    var cardFailures = 0;

    function updateCharCard(rects) {
      if (CHAR_CARD === 'off' || !charCard || !rects || !rects.length) return;
      if (cardSamples >= CARD_SAMPLES) return;   // 已锁定：卡不动了

      var u = cardUnion;
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (!u) u = cardUnion = [r[0], r[1], r[2], r[3]];
        if (r[0] < u[0]) u[0] = r[0];
        if (r[1] < u[1]) u[1] = r[1];
        if (r[2] > u[2]) u[2] = r[2];
        if (r[3] > u[3]) u[3] = r[3];
      }
      if (!u) return;
      // === 'all'：把名牌/状态也包进同一张卡 ===
      // 为什么需要这个模式：用户截图里名牌（Airi / online）背后也有一块浅色方块。
      // 它的成因在 headless Chrome 里复现不出来（Chrome 完全不画那块），所以我
      // 没法保证一定修掉。把它们并进一张白卡之后，**即使那块还在也看不见了** ——
      // 白底上的白块等于不存在。属于"用设计把不确定性兜住"。
      if (CHAR_CARD === 'all') {
        var extra = [document.querySelector('.pet-name'),
                     document.querySelector('.pet-status')];
        for (var k = 0; k < extra.length; k++) {
          if (!extra[k]) continue;
          var er = extra[k].getBoundingClientRect();
          if (er.width < 1 || er.height < 1) continue;
          if (er.left < u[0]) u[0] = er.left;
          if (er.top < u[1]) u[1] = er.top;
          if (er.right > u[2]) u[2] = er.right;
          if (er.bottom > u[3]) u[3] = er.bottom;
        }
      }
      // ⚠️ 为什么要取并集再锁定，而不是每次跟着角色走：
      // 模型一直在做 idle 动作（呼吸/微摆），外接框每次都会差几个像素。
      // 卡跟着变 = 每 500ms 抖一下，比白边本身难看得多。
      // 先采几次取并集（= 把摆动范围整个包住），然后焊死。
      var vw = document.documentElement.clientWidth || window.innerWidth || 0;
      var vh = document.documentElement.clientHeight || window.innerHeight || 0;
      // ⚠️ 0.3.41 —— 以前这两条失败分支写的是 `cardSamples = CARD_SAMPLES - 1`
      // （回退到 5），于是下一轮 `cardSamples >= CARD_SAMPLES` 又是 false，
      // **永远锁不定**：只要视口尺寸恒取不到（窗口还没创建完 / 极端 DPI），
      // 每 500ms 就重跑一次完整的 characterRects()（两次全画布 readPixels +
      // drawImage），永久 CPU 空转，cardUnion 还会随 idle 呼吸一直并集膨胀。
      // 改成"失败次数封顶"：重试 20 次仍不行就彻底放弃并锁定。
      if (!vw || !vh) { if (++cardFailures >= CARD_MAX_FAILURES) cardSamples = CARD_SAMPLES; return; }
      if (!(u[2] > u[0]) || !(u[3] > u[1])) { if (++cardFailures >= CARD_MAX_FAILURES) cardSamples = CARD_SAMPLES; return; }
      cardFailures = 0;

      // ⚠️ 采样计数只在**成功**时递增（0.3.43）。以前是"先 +1 再判是否到 6"，
      // 于是第 6 次一旦失败，cardSamples 已经停在 6 → 函数开头那句
      // `if (cardSamples >= CARD_SAMPLES) return` 把后续每次调用都挡回，
      // cardFailures 永远到不了 20 —— 注释承诺的"重试 20 次再放弃"是死代码，
      // 实际行为是"第一次失败就永久锁定"：本次会话再也不画角色底板，
      // 而 updateCharCard 全函数一条日志都没有，用户只看到白卡没了。
      cardSamples++;
      if (cardSamples < CARD_SAMPLES) return;

      var pad = (CHAR_CARD === 'all') ? CARD_PAD_ALL : CARD_PAD;
      var w = (u[2] - u[0]) + pad * 2;
      var h = (u[3] - u[1]) + pad * 2;
      var cx = (u[0] + u[2]) / 2, cy = (u[1] + u[3]) / 2;
      if (CHAR_CARD === 'square') {
        var side = Math.max(w, h);
        w = h = side;
      }
      // 夹进视口：卡片超出视口会被 region 切掉，看起来像缺了一块
      w = Math.min(w, vw);
      h = Math.min(h, vh);
      var left = Math.round(Math.min(Math.max(cx - w / 2, 0), Math.max(vw - w, 0)));
      var top = Math.round(Math.min(Math.max(cy - h / 2, 0), Math.max(vh - h, 0)));
      w = Math.round(w);
      h = Math.round(h);

      charCard.style.left = left + 'px';
      charCard.style.top = top + 'px';
      charCard.style.width = w + 'px';
      charCard.style.height = h + 'px';
      if (CHAR_CARD === 'frame') document.body.classList.add('card-frame');
      document.body.classList.add('card-on');

      // 底板一出现，窗口形状里就多了一块 —— 必须立刻重推一次，
      // 否则要等下一次轮询，那一瞬间卡会被 region 裁掉。
      if (typeof pushSilhouette === 'function') {
        setTimeout(function() { pushSilhouette(true); }, 0);
      }
    }

    // 读 alpha 的两条独立路径。为什么要两条：
    //   'gl'  = readPixels 主 framebuffer（常规做法，但依赖默认帧缓冲真的有 alpha 通道）
    //   '2d'  = 把 canvas 画到 2D canvas 再 getImageData（走合成器那条路，机制完全不同）
    // WebView2 的 windowed hosting 下，WebGL 默认帧缓冲有可能被强制成不透明，
    // 这时 'gl' 会读出"整张画布都是角色"，而 '2d' 仍可能拿到真 alpha。
    function readAlphaGrid(mode) {
      var app = live2d.app;
      if (!app) return null;
      var canvas = app.canvas;
      var w = canvas.width, h = canvas.height;
      if (!w || !h) return null;

      if (mode === 'gl') {
        var gl = app.renderer && app.renderer.gl;
        if (!gl) return null;
        var buf = new Uint8Array(w * h * 4);
        try {
          // 必须绑到主 framebuffer 才读得到真正画出来的那一帧
          var prev = gl.getParameter(gl.FRAMEBUFFER_BINDING);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
          gl.bindFramebuffer(gl.FRAMEBUFFER, prev);
        } catch (err) { return null; }
        // readPixels 的行序本来就是**自底向上**（第 0 行 = 画布最下边），
        // 与下游约定一致，不用动。
        return { buf: buf, w: w, h: h };
      }

      try {
        var c2 = document.createElement('canvas');
        c2.width = w; c2.height = h;
        var g2 = c2.getContext('2d');
        if (!g2) return null;
        g2.clearRect(0, 0, w, h);
        g2.drawImage(canvas, 0, 0, w, h);
        var img = g2.getImageData(0, 0, w, h);
        // ⚠️ getImageData 的行序与 readPixels **相反**：第 0 行是图片最上边。
        // 下游 scanAlpha() / alphaAt() 只认一种约定 ——「行 0 = 底边」
        // （alphaAt 的注释写着"WebGL 的 y 轴朝上，DOM 的朝下，这里要翻"）。
        // 这两条读取路径以前把行序当成一样的，于是**只有在 '2d' 回退路径上**
        // 轮廓矩形和点击命中会整体上下镜像：region 把倒过来的轮廓设成窗口形状，
        // 点头顶命中桌面、点空白处反而命中角色。
        // 'gl' 不可信时才会走到这里（WebView2 windowed hosting 下正是如此），
        // 所以这台机器从没暴露过 —— 但回退路径存在的意义就是那时候要能用。
        return { buf: rowsBottomUp(img.data, w, h), w: w, h: h };
      } catch (err) { return null; }
    }

    // 把"自顶向下"的像素行序翻成"自底向上"，与 readPixels 对齐。
    // 抽成独立函数是为了能被 node 单独加载做单元回归
    // （见 live2d_probe/test_alpha_orientation.py）—— 这段逻辑错一次，
    // 表现是"轮廓和点击上下颠倒"，在真实环境里极难判断方向。
    function rowsBottomUp(data, w, h) {
      var out = new Uint8ClampedArray(data.length);
      var stride = w * 4;
      for (var y = 0; y < h; y++) {
        out.set(data.subarray(y * stride, y * stride + stride), (h - 1 - y) * stride);
      }
      return out;
    }

    function mergeRuns(rows) {
      // 相邻行的区间几乎重合就并成一个大矩形：矩形数能从几百降到几十，
      // ExtCreateRegion 和每次重绘的开销都跟着降。
      var merged = [];
      for (var k = 0; k < rows.length; k++) {
        var cur = rows[k];
        var prev = merged.length ? merged[merged.length - 1] : null;
        if (prev && Math.abs(prev[0] - cur[0]) <= 2 &&
            Math.abs(prev[2] - cur[2]) <= 2 && prev[3] === cur[1]) {
          if (cur[0] < prev[0]) prev[0] = cur[0];
          if (cur[2] > prev[2]) prev[2] = cur[2];
          prev[3] = cur[3];
        } else {
          merged.push(cur.slice());
        }
      }
      return merged;
    }

    function scanAlpha(grid, rect) {
      var buf = grid.buf, w = grid.w, h = grid.h;
      var sx = rect.width / w, sy = rect.height / h;
      // 每行约压到 2 个 CSS 像素高。行太厚，角色上下边缘会出现肉眼可见的阶梯。
      var step = Math.max(1, Math.round(2 / Math.max(sy, 0.01)));
      var rows = [];
      var on = 0;
      for (var y = h - 1; y >= 0; y -= step) {
        var top = Math.round(rect.top + (h - 1 - y) * sy);
        var bottom = Math.round(top + step * sy);
        var base = y * w * 4;
        var run = -1;
        for (var x = 0; x <= w; x++) {
          var a = (x < w) ? buf[base + x * 4 + 3] : 0;
          if (a > SIL_ALPHA_MIN) {
            on++;
            if (run < 0) run = x;
          } else if (run >= 0) {
            rows.push([Math.round(rect.left + run * sx), top,
                       Math.round(rect.left + x * sx), bottom]);
            run = -1;
          }
        }
      }
      var sampled = Math.ceil(h / step) * w;
      return { rects: mergeRuns(rows), coverage: sampled ? (on / sampled) : -1 };
    }

    // 返回 {rects, coverage, source}
    //   source = 'gl' / '2d'        可信，可以用
    //   source = 'unreliable'       读数不可信，**不要**拿它设窗口形状
    //   source = 'none'             没有画布/没就绪
    function characterRects() {
      if (!live2d.ready || !live2d.app) return { rects: [], coverage: -1, source: 'none' };
      var rect = live2d.app.canvas.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return { rects: [], coverage: -1, source: 'none' };

      var g = readAlphaGrid('gl');
      var r = g ? scanAlpha(g, rect) : { rects: [], coverage: -1 };
      if (r.coverage >= 0 && r.coverage <= SIL_COVERAGE_MAX) {
        silAlphaMode = 'gl';
        return { rects: r.rects, coverage: r.coverage, source: 'gl' };
      }
      var g2 = readAlphaGrid('2d');
      var r2 = g2 ? scanAlpha(g2, rect) : { rects: [], coverage: -1 };
      if (r2.coverage >= 0 && r2.coverage <= SIL_COVERAGE_MAX) {
        silAlphaMode = '2d';
        return { rects: r2.rects, coverage: r2.coverage, source: '2d' };
      }
      // 两条路径都说"整张画布都是角色" -> 这个环境的 alpha 不可信。
      // 宁可留着方块，也不能把整窗设成 region（那等于什么都没做）
      // 更不能只推气泡矩形（那会把角色裁没）。
      silAlphaMode = 'off';
      return { rects: r2.rects.length ? r2.rects : r.rects,
               coverage: Math.max(r.coverage, r2.coverage),
               source: 'unreliable' };
    }

    // 把这一层的真实状态回报给宿主，写进 .airi-pet.log。
    // 没有这条链路，"为什么没透明"在用户侧完全无从判断：不透明可能来自
    // 轮廓算错、桥没通、句柄取不到、SetWindowRgn 失败，四层四种原因，
    // 而它们以前全都是静默的。
    function reportSil(stage, ch, res) {
      if (silDiagSent >= 12) return;
      silDiagSent++;
      try {
        var canvas = (live2d.app && live2d.app.canvas) || null;
        var box = canvas ? canvas.getBoundingClientRect() : null;
        // 必须用绝对地址 EVENT_URL（主服务器端口）。这里曾经写的是相对路径
        // '/event' —— 而页面是从**资产服务器**（start_asset_server 的动态端口）
        // 加载的，相对路径会打到资产服务器上，它只认 /、/vendor/、/pet-assets/，
        // 其余一律 404（见 common.py 的 _AssetHandler.do_GET）。
        // 后果：轮廓诊断从来没有一条进过 .airi-pet.log（实测 sil=0 / js=2），
        // 而且 silDiagSent 配额照常烧掉 —— 后面真正失败时也不再上报，
        // 这条"为什么没透明"的黑匣子整体失明。同文件的 reportJS 用的是
        // EVENT_URL，所以只有它一直好使。
        fetch(EVENT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'silhouetteDiag',
            payload: {
              stage: stage,
              source: ch ? ch.source : '-',
              coverage: ch ? Math.round((ch.coverage || 0) * 10000) / 10000 : -1,
              charRects: ch && ch.rects ? ch.rects.length : -1,
              uiRects: collectUiRects().length,
              vw: document.documentElement.clientWidth,
              vh: document.documentElement.clientHeight,
              inner: window.innerWidth + 'x' + window.innerHeight,
              canvas: canvas ? (canvas.width + 'x' + canvas.height) : '-',
              cssBox: box ? (Math.round(box.width) + 'x' + Math.round(box.height) +
                             '@' + Math.round(box.left) + ',' + Math.round(box.top)) : '-',
              dpr: window.devicePixelRatio || 1,
              live2d: !!(window.__airi && window.__airi.live2d && window.__airi.live2d.ready),
              host: res ? { ok: !!res.ok, why: res.why || '',
                            rects: res.rects, meta: res.meta } : null
            }
          })
        }).catch(function() { /* 服务器不可达：这是唯一一条没有 .catch 的
              fetch（reportJS / setDetectSec / syncDetectSec / edit-corpus 都
              有），fetch 的**异步**拒绝逃得过外面的 try/catch —— 会被全局
              unhandledrejection 兜住，再反过来上报一条 'jsError: Failed to
              fetch'，把真正的失败原因淹没在噪音里 */ });
      } catch (err) { /* 诊断失败绝不能影响主流程 */ }
    }

    function pushSilhouette(force) {
      if (!live2d.ready) return;
      // 连续失败后放慢重试，但**永不放弃** —— 模块加载顺序、窗口创建时机
      // 都可能让前几次失败，永久放弃等于把这条路焊死。上一版就是 3 次即止。
      if (!force && Date.now() < silNextAt) return;
      // 气泡 popUp / fade-out 动画进行中（520ms 窗口）周期轮询**跳过**：
      // 动画中的 getBoundingClientRect 是"位移+缩放"后的盒子，比最终位置
      // 低十几像素，拿它当 region 就把气泡顶边裁掉一截；若之后页面被冻结，
      // 这个错误形状会永久驻留（第十轮截图的来源）。force 推送不受限 ——
      // showBubble 在动画第一帧之前推（最终位置），动画结束 540ms 再推一次。
      if (!force && lastBubbleChangeAt && Date.now() - lastBubbleChangeAt < 520) return;

      var ch = characterRects();
      // 底板先于窗口形状更新：collectUiRects() 得把卡的位置算进去。
      // 读数不可信时不设底板 —— 那种情况下 rects 是整个画布，卡会撑成一整张白幕。
      if (ch.source !== 'unreliable' && ch.rects.length) updateCharCard(ch.rects);

      // 底板只跟"角色画在哪儿"有关。即使 SILHOUETTE=0（放弃异形窗口），
      // 底板仍然要工作，所以这个 return 放在底板更新之后。
      if (!SILHOUETTE) return;

      var api = window.pywebview && window.pywebview.api;
      if (!api || !api.set_window_region) { reportSil('no-api', null); return; }

      if (ch.source === 'unreliable' || !ch.rects.length) {
        // 安全阀：轮廓拿不到时**绝不能**只把气泡/名字推上去 ——
        // 那会把窗口裁成一小条，角色直接消失。宁可暂时留着方块。
        reportSil('silhouette-unusable', ch);
        silNextAt = Date.now() + 5000;
        return;
      }

      var vw = document.documentElement.clientWidth || window.innerWidth || 0;
      var vh = document.documentElement.clientHeight || window.innerHeight || 0;
      if (!vw || !vh) { reportSil('no-viewport', ch); return; }

      var payload = { vw: vw, vh: vh, src: ch.source, rects: ch.rects.concat(collectUiRects()) };
      var key = JSON.stringify(payload);
      if (key === silLastKey) return;     // 形状没变就别打扰 Python
      silLastKey = key;

      Promise.resolve(api.set_window_region(payload)).then(function(res) {
        if (res && res.ok) {
          if (silFails) reportSil('recovered', ch, res);
          silFails = 0; silNextAt = 0;
          if (silDiagSent < 3) reportSil('applied', ch, res);
        } else {
          silFails++;
          silNextAt = Date.now() + 5000;
          reportSil('host-reject', ch, res);
          // 失败时清掉 key，让下次能重发同一形状
          silLastKey = '';
        }
      }, function(err) {
        silFails++;
        silNextAt = Date.now() + 5000;
        silLastKey = '';
        reportSil('bridge-error', ch, { why: String(err && err.message || err) });
      });
    }

    function startSilhouetteLoop() {
      // 只关掉异形窗口、但还想留角色底板时，循环照样要跑 ——
      // 底板的位置也来自这条 readPixels 扫描，只是频率可以低一点（readPixels 不便宜）。
      if (!SILHOUETTE && CHAR_CARD === 'off') return;
      var iv = SILHOUETTE ? SIL_INTERVAL : 1200;
      setInterval(pushSilhouette, iv);
      setTimeout(function() { pushSilhouette(true); }, 900);  // 首帧：等 Live2D 真正画出第一帧
      setTimeout(function() { pushSilhouette(true); }, 2500);
    }

    // ============ 右键菜单 ============
    var menuAnchorX = 0, menuAnchorY = 0;
    // 「编辑语料」的在途标志（0.3.43）：菜单的 180ms visibility 过渡期内
    // 元素仍可点击，双击会发两次请求（见 click handler 里的注释）。
    var corpusOpenBusy = false;

    /** 把菜单收敛进窗口（留 4px 呼吸）。
     *  溢出窗口的部分会被 OS 裁掉 —— region 只能包含窗口内的像素，溢出那块
     *  永远显示不出来。visibility:hidden 不影响 offsetWidth 量取。 */
    function positionMenu() {
      var mw = contextMenu.offsetWidth || 130;
      var mh = contextMenu.offsetHeight || 72;
      var mx = Math.max(0, Math.min(menuAnchorX, window.innerWidth - mw - 4));
